<script>
/* ════════════════════════════════════════════════════════════════════════
   JavaScript.html · Lógica de cliente.
   Secciones: 1) puente con el servidor  2) estado  3) interfaz base
              4) paso 1 insumos  5) paso 2 actividades y tiempos
              6) catálogo de bloques  7) paso 3 editor drag & drop
              8) paso 4 vista previa y documento  9) biblioteca y ajustes
   ════════════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────── 1. Puente con Google Apps Script ── */

/** Ejecuta una función del servidor y devuelve una promesa con su valor crudo. */
function llamar(nombre) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve, reject) => {
    // El runner debe conservar su propio `this`: los manejadores viven en él.
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(new Error(err && err.message ? err.message : String(err))));
    runner[nombre].apply(runner, args);
  });
}

/** Igual que llamar(), pero desempaqueta el sobre {ok, data, error}. */
async function pedir(nombre) {
  const args = Array.prototype.slice.call(arguments, 1);
  const res = await llamar.apply(null, [nombre].concat(args));
  if (res && typeof res === 'object' && 'ok' in res) {
    if (!res.ok) throw new Error(res.error || 'Error desconocido en el servidor.');
    return res.data;
  }
  return res;
}

/* ──────────────────────────────────────────────────────── 2. Estado ── */

const S = {
  insumos: {},
  proyecto: null,
  distribucion: null,
  archivoId: null,
  docId: '',
  docUrl: '',
  filtroFase: 'todas',
  sel: null,               // {f, c} celda seleccionada
  config: null,
  plantilla: {
    orientacion: 'vertical',
    columnas: 4,
    anchos: [22, 40, 14, 24],
    filas: [],
    estilo: {
      fuente: 'Arial', tamano: 9,
      colorPrimario: '#E5397F', colorTexto: '#1F2430',
      colorBorde: '#C8CDD8', anchoBorde: 1,
      fondoEncabezado: '#FDE7F0', colorEncabezado: '#8A1F4C'
    },
    meta: {}
  }
};

const $  = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

/* ────────────────────────────────────────────── 3. Interfaz base ── */

function toast(mensaje, tipo = 'ok', ms = 4200) {
  const t = document.createElement('div');
  t.className = 'toast toast--' + tipo;
  t.innerHTML = '<span class="ico">' +
    (tipo === 'error' ? '⚠️' : tipo === 'alerta' ? '💡' : '✅') +
    '</span><span></span>';
  t.lastChild.textContent = mensaje;
  $('#toasts').appendChild(t);
  setTimeout(() => {
    t.classList.add('is-saliendo');
    setTimeout(() => t.remove(), 260);
  }, ms);
}

function cargando(activo, texto, nota) {
  const caja = $('#cargando');
  if (activo) {
    $('#cargandoTexto').textContent = texto || 'Trabajando…';
    $('#cargandoNota').textContent = nota || 'Esto puede tardar unos segundos.';
    caja.hidden = false;
  } else {
    caja.hidden = true;
  }
}

function abrirModal(id) { $(id).hidden = false; }
function cerrarModal(id) { $(id).hidden = true; }

document.addEventListener('click', e => {
  if (e.target.matches('[data-cerrar]')) e.target.closest('.modal').hidden = true;
  if (e.target.classList.contains('modal')) e.target.hidden = true;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $$('.modal').forEach(m => m.hidden = true);
});

function irAPaso(n) {
  $$('.vista').forEach(v => v.classList.remove('is-active'));
  $('#vista-' + n).classList.add('is-active');
  $$('.step').forEach(s => {
    const p = Number(s.dataset.paso);
    s.classList.toggle('is-active', p === n);
    s.classList.toggle('is-done', p < n);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (n === 4) renderPrevia();
}

$$('.step').forEach(s => s.addEventListener('click', () => {
  const destino = Number(s.dataset.paso);
  if (destino > 1 && !S.proyecto) return toast('Primero genera la propuesta con IA.', 'alerta');
  if (destino >= 3 && !S.distribucion) return toast('Calcula los tiempos antes de diseñar la plantilla.', 'alerta');
  irAPaso(destino);
}));

const escapar = txt => String(txt == null ? '' : txt)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

const minutos = m => {
  m = Math.round(Number(m) || 0);
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return h + ' h' + (r ? ' ' + r + ' min' : '');
};

/* ───────────────────────────────────────── 4. Paso 1 · Insumos ── */

function leerInsumos() {
  const f = $('#formInsumos');
  return {
    tema: f.tema.value.trim(),
    nivel: f.nivel.value,
    grado: f.grado.value.trim(),
    campoFormativo: f.campoFormativo.value,
    caracteristicasGrupo: f.caracteristicasGrupo.value.trim(),
    recursos: f.recursos.value.trim(),
    contextoComunitario: f.contextoComunitario.value.trim(),
    sesiones: Number(f.sesiones.value),
    minutosPorSesion: Number(f.minutosPorSesion.value),
    semanas: Number(f.semanas.value) || null,
    actividadesPorMomento: Number(f.actividadesPorMomento.value)
  };
}

function actualizarChips() {
  const i = leerInsumos();
  const total = (i.sesiones || 0) * (i.minutosPorSesion || 0);
  $('#chipTiempoTotal').textContent = total ? minutos(total) + ' en total' : 'Define el tiempo disponible';
  $('#chipActividades').textContent = '≈ ' + (11 * (i.actividadesPorMomento || 2)) + ' actividades propuestas';
}
['sesiones', 'minutosPorSesion', 'actividadesPorMomento'].forEach(id =>
  $('#' + id).addEventListener('input', actualizarChips));

$('#formInsumos').addEventListener('submit', async e => {
  e.preventDefault();
  S.insumos = leerInsumos();
  cargando(true, 'La IA está construyendo tu proyecto…',
    'Genera 11 momentos con actividades, evaluación y recursos. Puede tardar hasta un minuto.');
  try {
    S.proyecto = await pedir('generarInsumos', S.insumos);
    S.archivoId = null;
    S.docId = '';
    await recalcularTiempos();
    renderPaso2();
    irAPaso(2);
    toast('Propuesta generada. Revisa y elige las actividades.');
  } catch (err) {
    toast(err.message, 'error', 8000);
  } finally {
    cargando(false);
  }
});

$('#btnLimpiar').addEventListener('click', () => {
  $('#formInsumos').reset();
  actualizarChips();
});

$('#btnVolver1').addEventListener('click', () => irAPaso(1));
$('#btnVolver2').addEventListener('click', () => irAPaso(2));
$('#btnVolver3').addEventListener('click', () => irAPaso(3));

/* ───────────────────────────── 5. Paso 2 · Actividades y tiempos ── */

function todasLasActividades() {
  const lista = [];
  (S.proyecto.momentos || []).forEach(m =>
    (m.actividades || []).forEach(a => lista.push(a)));
  return lista;
}

function seleccionadas() {
  return todasLasActividades().filter(a => a.seleccionada !== false);
}

async function recalcularTiempos(silencioso) {
  if (!S.proyecto) return;
  if (!seleccionadas().length) {
    S.distribucion = null;
    pintarCifras();
    return;
  }
  try {
    S.distribucion = await pedir('distribuirTiempos', S.proyecto, {
      sesiones: S.insumos.sesiones,
      minutosPorSesion: S.insumos.minutosPorSesion,
      modo: $('#modoReparto').value
    });
    // El servidor devuelve las duraciones definitivas: se reflejan en las tarjetas.
    const porId = {};
    S.distribucion.actividades.forEach(a => { porId[a.id] = a; });
    todasLasActividades().forEach(a => {
      if (porId[a.id]) a.duracionAsignada = porId[a.id].duracionAsignada;
    });
    pintarCifras();
    pintarMinutosEnTarjetas();
    if (!silencioso) toast('Tiempos redistribuidos.');
  } catch (err) {
    toast(err.message, 'error', 7000);
  }
}

function pintarCifras() {
  const d = S.distribucion;
  $('#cifraSeleccionadas').textContent = seleccionadas().length;
  $('#cifraDisponible').textContent = d ? d.totalDisponible : (S.insumos.sesiones * S.insumos.minutosPorSesion) || 0;
  $('#cifraAsignado').textContent = d ? d.totalAsignado : 0;
  $('#cifraSesiones').textContent = d ? d.sesionesUsadas : 0;

  const barra = $('#barraFases');
  barra.innerHTML = '';
  if (!d) return;
  d.porFase.forEach(f => {
    const seg = document.createElement('div');
    seg.className = 'barra-fases__seg';
    seg.style.flexGrow = Math.max(f.porcentaje, 1);
    seg.title = f.nombre + ' · ' + minutos(f.minutos);
    seg.textContent = f.porcentaje >= 10 ? f.nombre + ' ' + f.porcentaje + '%' : f.porcentaje + '%';
    barra.appendChild(seg);
  });

  if (d.desborde > 0) {
    $('#cifraSesiones').style.color = 'var(--error)';
  } else {
    $('#cifraSesiones').style.color = '';
  }
}

function pintarMinutosEnTarjetas() {
  todasLasActividades().forEach(a => {
    const input = document.querySelector('.act__min[data-id="' + a.id + '"]');
    if (input) input.value = a.duracionAsignada;
  });
}

function renderPaso2() {
  const p = S.proyecto;
  $('#tituloProyecto').textContent = p.tituloProyecto || 'Propuesta generada';
  $('#problematicaProyecto').textContent = p.problematica || '';

  const fases = ['todas', 'Planeación', 'Acción', 'Intervención'];
  $('#filtrosFase').innerHTML = fases.map(f =>
    '<button type="button" class="filtro' + (S.filtroFase === f ? ' is-active' : '') +
    '" data-fase="' + escapar(f) + '">' + (f === 'todas' ? 'Todas las fases' : f) + '</button>'
  ).join('');

  const cont = $('#listaMomentos');
  cont.innerHTML = '';

  p.momentos.forEach((m, i) => {
    if (S.filtroFase !== 'todas' && m.fase !== S.filtroFase) return;

    const elegidas = (m.actividades || []).filter(a => a.seleccionada !== false);
    const totalMin = elegidas.reduce((s, a) => s + (a.duracionAsignada || 0), 0);

    const card = document.createElement('article');
    card.className = 'momento';
    card.innerHTML =
      '<header class="momento__head">' +
        '<span class="momento__fase" data-fase="' + escapar(m.fase) + '">' + escapar(m.fase) + '</span>' +
        '<span class="momento__titulo">' + (i + 1) + '. ' + escapar(m.momento) + '</span>' +
        '<span class="momento__meta">' +
          '<span class="chip">' + elegidas.length + ' de ' + (m.actividades || []).length + '</span>' +
          '<span class="chip chip--tiempo">' + minutos(totalMin) + '</span>' +
          '<button type="button" class="btn btn--mini" data-regenerar="' + i + '">🔄 Otras ideas</button>' +
        '</span>' +
      '</header>' +
      '<div class="momento__cuerpo">' +
        (m.proposito ? '<p class="momento__proposito">' + escapar(m.proposito) + '</p>' : '') +
        '<div class="tarjetas-act"></div>' +
      '</div>';

    const grid = card.querySelector('.tarjetas-act');
    (m.actividades || []).forEach(a => grid.appendChild(tarjetaActividad(a)));
    cont.appendChild(card);
  });

  if (!cont.children.length) {
    cont.innerHTML = '<p class="vacio">No hay momentos para el filtro seleccionado.</p>';
  }
  pintarCifras();
}

function tarjetaActividad(a) {
  const el = document.createElement('div');
  el.className = 'act ' + (a.seleccionada !== false ? 'is-on' : 'is-off');
  el.dataset.id = a.id;
  el.innerHTML =
    '<div class="act__head">' +
      '<input type="checkbox" class="act__check"' + (a.seleccionada !== false ? ' checked' : '') + '>' +
      '<div class="act__titulo">' + escapar(a.titulo) + '</div>' +
    '</div>' +
    '<p class="act__desc">' + escapar(a.descripcion) + '</p>' +
    (a.evidencia ? '<p class="act__desc"><b>Evidencia:</b> ' + escapar(a.evidencia) + '</p>' : '') +
    '<div class="act__pies">' +
      '<span class="etiqueta">' + escapar(a.organizacion) + '</span>' +
      (a.participacionComunitaria && !/^ningun/i.test(a.participacionComunitaria)
        ? '<span class="etiqueta etiqueta--com">🤝 comunidad</span>' : '') +
      '<input type="number" class="act__min" data-id="' + a.id + '" min="5" step="5" value="' +
        (a.duracionAsignada || a.duracionSugerida) + '" title="Minutos asignados">' +
      '<span class="etiqueta">min</span>' +
    '</div>';

  el.querySelector('.act__check').addEventListener('change', ev => {
    a.seleccionada = ev.target.checked;
    el.classList.toggle('is-on', a.seleccionada);
    el.classList.toggle('is-off', !a.seleccionada);
    recalcularTiempos(true);
  });

  el.querySelector('.act__min').addEventListener('change', ev => {
    a.duracionAsignada = Math.max(5, Number(ev.target.value) || 5);
    a.duracionSugerida = a.duracionAsignada;
    if ($('#modoReparto').value === 'manual') recalcularTiempos(true);
  });

  return el;
}

$('#filtrosFase').addEventListener('click', e => {
  const b = e.target.closest('.filtro');
  if (!b) return;
  S.filtroFase = b.dataset.fase;
  renderPaso2();
});

$('#listaMomentos').addEventListener('click', async e => {
  const btn = e.target.closest('[data-regenerar]');
  if (btn) {
    const i = Number(btn.dataset.regenerar);
    const m = S.proyecto.momentos[i];
    cargando(true, 'Buscando otras actividades…', 'Solo para el momento «' + m.momento + '».');
    try {
      const nuevas = await pedir('regenerarMomento', S.insumos, m.fase, m.momento, m.actividades);
      if (!nuevas.length) throw new Error('La IA no devolvió actividades nuevas.');
      m.actividades = m.actividades.concat(nuevas);
      renderPaso2();
      await recalcularTiempos(true);
      toast('Se agregaron ' + nuevas.length + ' actividades nuevas.');
    } catch (err) {
      toast(err.message, 'error', 7000);
    } finally {
      cargando(false);
    }
    return;
  }
  const head = e.target.closest('.momento__head');
  if (head && !e.target.closest('button')) head.parentElement.classList.toggle('is-cerrado');
});

$('#btnRecalcular').addEventListener('click', () => recalcularTiempos());
$('#modoReparto').addEventListener('change', () => recalcularTiempos());

$('#btnVerExplicacion').addEventListener('click', () => {
  const e = S.proyecto.explicacion || {};
  let html = '';
  if (e.resumen) html += '<p>' + escapar(e.resumen) + '</p>';
  if (e.relevanciaComunitaria) html += '<h4>Relevancia comunitaria</h4><p>' + escapar(e.relevanciaComunitaria) + '</p>';
  if ((e.conceptosClave || []).length) {
    html += '<h4>Conceptos clave</h4>' + e.conceptosClave.map(c =>
      '<p><b>' + escapar(c.titulo) + ':</b> ' + escapar(c.texto) + '</p>').join('');
  }
  if ((e.erroresFrecuentes || []).length) {
    html += '<h4>Errores frecuentes</h4><ul>' +
      e.erroresFrecuentes.map(x => '<li>' + escapar(x) + '</li>').join('') + '</ul>';
  }
  $('#cuerpoExplicacion').innerHTML = html || '<p class="vacio">Sin explicación disponible.</p>';
  abrirModal('#modalExplicacion');
});

$('#btnIrPlantilla').addEventListener('click', async () => {
  if (!seleccionadas().length) return toast('Elige al menos una actividad.', 'alerta');
  if (!S.distribucion) await recalcularTiempos(true);
  construirBloques();
  if (!S.plantilla.filas.length) aplicarPreajuste('clasica');
  renderPaleta();
  renderRejilla();
  irAPaso(3);
});

/* ────────────────────────────────── 6. Catálogo de bloques ── */

let BLOQUES = [];
let MAPA_BLOQUES = {};

const P_TXT   = texto => ({ tipo: 'texto', texto: texto });
const P_TIT   = texto => ({ tipo: 'titulo', texto: texto });
const P_VIN   = texto => ({ tipo: 'vineta', texto: texto });
const P_CLAVE = (etiqueta, texto) => ({ tipo: 'clave', etiqueta: etiqueta, texto: texto });

function bloque(id, nombre, grupo, icono, fn) {
  return { id, nombre, grupo, icono, parrafos: fn };
}

function listaVinetas(arr) {
  return (arr || []).filter(Boolean).map(P_VIN);
}

function parrafosActividad(a, conDetalle) {
  const out = [P_TIT(a.titulo)];
  if (a.descripcion) out.push(P_TXT(a.descripcion));
  if (conDetalle) {
    if (a.consignaAlumno) out.push(P_CLAVE('Consigna', a.consignaAlumno));
    if (a.evidencia) out.push(P_CLAVE('Evidencia', a.evidencia));
    if (a.participacionComunitaria && !/^ningun/i.test(a.participacionComunitaria)) {
      out.push(P_CLAVE('Comunidad', a.participacionComunitaria));
    }
    if ((a.recursos || []).length) out.push(P_CLAVE('Recursos', a.recursos.join(', ')));
  }
  out.push(P_CLAVE('Tiempo', minutos(a.duracionAsignada || a.duracionSugerida)));
  return out;
}

function construirBloques() {
  const p = S.proyecto;
  const d = S.distribucion;
  const B = [];

  /* Identidad del proyecto */
  B.push(bloque('titulo_proyecto', 'Título del proyecto', 'Identidad', '🏷️', () => [P_TXT(p.tituloProyecto)]));
  B.push(bloque('problematica', 'Problemática', 'Identidad', '❗', () => [P_TXT(p.problematica)]));
  B.push(bloque('producto_final', 'Producto final', 'Identidad', '🎁', () => [P_TXT(p.productoFinal)]));
  B.push(bloque('campos_formativos', 'Campos formativos', 'Identidad', '🧭', () => listaVinetas(p.camposFormativos)));
  B.push(bloque('ejes_articuladores', 'Ejes articuladores', 'Identidad', '🔗', () => listaVinetas(p.ejesArticuladores)));
  B.push(bloque('contenidos', 'Contenidos', 'Identidad', '📘', () => listaVinetas(p.contenidos)));
  B.push(bloque('pda', 'Procesos de desarrollo (PDA)', 'Identidad', '📈', () => listaVinetas(p.pda)));

  /* Explicación del tema */
  const e = p.explicacion || {};
  B.push(bloque('explicacion_resumen', 'Explicación del tema', 'Explicación', '📖', () => [P_TXT(e.resumen)]));
  B.push(bloque('explicacion_relevancia', 'Relevancia comunitaria', 'Explicación', '🏘️', () => [P_TXT(e.relevanciaComunitaria)]));
  B.push(bloque('conceptos_clave', 'Conceptos clave', 'Explicación', '🔑', () =>
    (e.conceptosClave || []).map(c => P_CLAVE(c.titulo, c.texto))));
  B.push(bloque('errores_frecuentes', 'Errores frecuentes', 'Explicación', '⚠️', () => listaVinetas(e.erroresFrecuentes)));

  /* Fases completas */
  ['Planeación', 'Acción', 'Intervención'].forEach(fase => {
    const clave = 'fase_' + fase.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    B.push(bloque(clave, 'Fase ' + fase + ' (completa)', 'Fases', '🧩', () => {
      const out = [];
      p.momentos.filter(m => m.fase === fase).forEach(m => {
        const elegidas = (m.actividades || []).filter(a => a.seleccionada !== false);
        if (!elegidas.length) return;
        out.push(P_TIT(m.momento));
        elegidas.forEach(a => {
          out.push(P_VIN(a.titulo + ' — ' + minutos(a.duracionAsignada)));
          if (a.descripcion) out.push(P_TXT(a.descripcion));
        });
      });
      return out;
    }));
  });

  /* Momentos, uno por uno */
  p.momentos.forEach((m, i) => {
    const n = i + 1;
    B.push(bloque('momento_' + n, n + '. ' + m.momento, 'Momentos', '🔹', () => {
      const elegidas = (m.actividades || []).filter(a => a.seleccionada !== false);
      if (!elegidas.length) return [P_TXT('(sin actividades seleccionadas)')];
      const out = [];
      elegidas.forEach(a => parrafosActividad(a, true).forEach(x => out.push(x)));
      return out;
    }));
    B.push(bloque('momento_' + n + '_lista', n + '. ' + m.momento + ' (solo títulos)', 'Momentos', '▫️', () =>
      listaVinetas((m.actividades || []).filter(a => a.seleccionada !== false).map(a => a.titulo))));
    B.push(bloque('momento_' + n + '_tiempo', n + '. ' + m.momento + ' (tiempo)', 'Momentos', '⏱️', () => {
      const t = (m.actividades || []).filter(a => a.seleccionada !== false)
        .reduce((s, a) => s + (a.duracionAsignada || 0), 0);
      return [P_TXT(minutos(t))];
    }));
    B.push(bloque('momento_' + n + '_nombre', n + '. ' + m.momento + ' (nombre)', 'Momentos', '🔖', () =>
      [P_TXT(m.fase + ' · ' + m.momento)]));
  });

  /* Actividades sueltas */
  seleccionadas().forEach(a => {
    B.push(bloque(a.id, a.titulo, 'Actividades', '✏️', () => parrafosActividad(a, true)));
  });

  /* Tiempos y agenda */
  B.push(bloque('tiempo_total', 'Tiempo total', 'Tiempos', '⏳', () =>
    [P_TXT(d ? minutos(d.totalAsignado) + ' en ' + d.sesionesUsadas + ' sesiones' : '')]));
  B.push(bloque('distribucion_fases', 'Distribución por fase', 'Tiempos', '📊', () =>
    (d ? d.porFase : []).map(f => P_CLAVE(f.nombre, minutos(f.minutos) + ' (' + f.porcentaje + '%)'))));
  B.push(bloque('agenda_sesiones', 'Agenda de sesiones', 'Tiempos', '🗓️', () => {
    const out = [];
    (d ? d.sesiones : []).forEach(s => {
      out.push(P_TIT('Sesión ' + s.numero + ' · ' + minutos(s.minutosUsados)));
      s.bloques.forEach(b => out.push(P_VIN(b.titulo + ' (' + minutos(b.minutos) + ')')));
    });
    return out;
  }));
  (d ? d.sesiones : []).forEach(s => {
    B.push(bloque('sesion_' + s.numero, 'Sesión ' + s.numero, 'Tiempos', '📅', () =>
      s.bloques.map(b => P_VIN(b.titulo + ' — ' + minutos(b.minutos)))));
  });

  /* Evaluación */
  const ev = p.evaluacion || {};
  B.push(bloque('evaluacion_enfoque', 'Enfoque de evaluación', 'Evaluación', '🎯', () => [P_TXT(ev.enfoque)]));
  B.push(bloque('evaluacion_instrumentos', 'Instrumentos', 'Evaluación', '🧪', () =>
    (ev.instrumentos || []).map(x => P_CLAVE(x.nombre, x.descripcion + (x.momentoDeUso ? ' (' + x.momentoDeUso + ')' : '')))));
  B.push(bloque('evaluacion_criterios', 'Criterios', 'Evaluación', '📏', () => listaVinetas(ev.criterios)));
  B.push(bloque('evaluacion_indicadores', 'Indicadores de logro', 'Evaluación', '⭐', () => listaVinetas(ev.indicadoresLogro)));

  /* Recursos y ajustes */
  B.push(bloque('recursos', 'Recursos y materiales', 'Recursos', '🎒', () => listaVinetas(p.recursosConsolidados)));
  B.push(bloque('adecuaciones', 'Adecuaciones', 'Recursos', '♿', () =>
    (p.adecuaciones || []).map(a => P_CLAVE(a.situacion, a.ajuste))));
  B.push(bloque('vinculacion_familias', 'Vinculación con familias', 'Recursos', '👪', () =>
    [P_TXT(p.vinculacionFamilias)]));

  /* Datos institucionales */
  const metas = [
    ['docente', 'Docente'], ['escuela', 'Escuela'], ['cct', 'CCT'], ['zona', 'Zona / sector'],
    ['ciclo', 'Ciclo escolar'], ['gradoGrupo', 'Grado y grupo'], ['asignatura', 'Asignatura'],
    ['periodo', 'Periodo'], ['director', 'Director(a)']
  ];
  metas.forEach(([k, etiqueta]) => {
    B.push(bloque('meta_' + k, etiqueta, 'Datos', '🏫', () => [P_TXT(S.plantilla.meta[k] || '')]));
  });
  B.push(bloque('meta_fecha', 'Fecha de elaboración', 'Datos', '📆', () =>
    [P_TXT(new Date().toLocaleDateString('es-MX', { day: '2-digit', month: 'long', year: 'numeric' }))]));

  BLOQUES = B;
  MAPA_BLOQUES = {};
  B.forEach(b => { MAPA_BLOQUES[b.id] = b; });
}

/** Devuelve los párrafos ya resueltos de un bloque (o un aviso si no existe). */
function parrafosDe(id) {
  const b = MAPA_BLOQUES[id];
  if (!b) return [P_TXT('[bloque «' + id + '» no disponible]')];
  try {
    return (b.parrafos() || []).filter(p => (p.texto && String(p.texto).trim()) || p.etiqueta);
  } catch (err) {
    return [P_TXT('[error al resolver «' + id + '»]')];
  }
}

/** Versión en texto plano, para sustituir {{marcadores}} dentro del texto libre. */
function textoPlanoDe(id) {
  return parrafosDe(id).map(p => {
    if (p.etiqueta && p.texto) return p.etiqueta + ': ' + p.texto;
    return p.etiqueta || p.texto;
  }).join('\n');
}

const bloquesUsados = () => {
  const usados = new Set();
  S.plantilla.filas.forEach(f => f.celdas.forEach(c => {
    (c.bloques || []).forEach(b => usados.add(b));
    (String(c.texto || '').match(/\{\{\s*([\w-]+)\s*\}\}/g) || []).forEach(m =>
      usados.add(m.replace(/[{}\s]/g, '')));
  }));
  return usados;
};

function renderPaleta() {
  const filtro = $('#buscarBloque').value.trim().toLowerCase();
  const usados = bloquesUsados();
  const grupos = {};

  BLOQUES.forEach(b => {
    if (filtro && b.nombre.toLowerCase().indexOf(filtro) === -1 && b.id.indexOf(filtro) === -1) return;
    (grupos[b.grupo] = grupos[b.grupo] || []).push(b);
  });

  const cont = $('#paletaLista');
  cont.innerHTML = '';

  Object.keys(grupos).forEach(g => {
    const div = document.createElement('div');
    div.className = 'grupo-bloques';
    div.innerHTML = '<h4>' + escapar(g) + '</h4><div class="grupo-bloques__items"></div>';
    const items = div.querySelector('.grupo-bloques__items');

    grupos[g].forEach(b => {
      const el = document.createElement('div');
      el.className = 'bloque' + (usados.has(b.id) ? ' is-usado' : '');
      el.draggable = true;
      el.dataset.bloque = b.id;
      el.title = b.nombre + '  ·  {{' + b.id + '}}';
      el.innerHTML = '<span class="bloque__icono">' + b.icono + '</span>' +
                     '<span class="bloque__nombre">' + escapar(b.nombre) + '</span>';
      items.appendChild(el);
    });
    cont.appendChild(div);
  });

  if (!cont.children.length) cont.innerHTML = '<p class="vacio">Sin coincidencias.</p>';
}

$('#buscarBloque').addEventListener('input', renderPaleta);

/* ─────────────────────── 7. Paso 3 · Editor drag & drop de la rejilla ── */

function celdaNueva(tipo) {
  return {
    texto: '', bloques: [], colspan: 1, rowspan: 1, oculta: false,
    tipo: tipo || 'normal',
    estilo: { fondo: '', color: '', negrita: false, alineacion: '', tamano: 0 }
  };
}

function filaNueva(columnas, tipo) {
  const celdas = [];
  for (let i = 0; i < columnas; i++) celdas.push(celdaNueva(tipo));
  return { celdas };
}

function renderRejilla() {
  const P = S.plantilla;
  const tabla = $('#rejilla');
  tabla.innerHTML = '';

  const colgroup = document.createElement('colgroup');
  for (let c = 0; c < P.columnas; c++) {
    const col = document.createElement('col');
    if (P.anchos && P.anchos[c]) col.style.width = P.anchos[c] + '%';
    colgroup.appendChild(col);
  }
  tabla.appendChild(colgroup);

  const tbody = document.createElement('tbody');

  P.filas.forEach((fila, f) => {
    const tr = document.createElement('tr');
    fila.celdas.forEach((celda, c) => {
      if (celda.oculta) return;

      const td = document.createElement('td');
      if (celda.colspan > 1) td.colSpan = celda.colspan;
      if (celda.rowspan > 1) td.rowSpan = celda.rowspan;

      const div = document.createElement('div');
      div.className = 'celda' + (celda.tipo === 'encabezado' ? ' es-encabezado' : '') +
        (S.sel && S.sel.f === f && S.sel.c === c ? ' is-sel' : '');
      div.dataset.f = f;
      div.dataset.c = c;
      if (celda.estilo.fondo) div.style.background = celda.estilo.fondo;
      if (celda.estilo.color) div.style.color = celda.estilo.color;
      if (celda.estilo.negrita) div.style.fontWeight = '700';
      if (celda.estilo.alineacion) div.style.textAlign = alineacionCSS(celda.estilo.alineacion);

      const txt = document.createElement('div');
      txt.className = 'celda__texto';
      txt.contentEditable = 'true';
      txt.spellcheck = false;
      txt.textContent = celda.texto || '';
      div.appendChild(txt);

      if ((celda.bloques || []).length) {
        const fichas = document.createElement('div');
        fichas.className = 'celda__fichas';
        celda.bloques.forEach((id, k) => {
          const b = MAPA_BLOQUES[id];
          const ficha = document.createElement('span');
          ficha.className = 'ficha';
          ficha.innerHTML = '<span>' + escapar(b ? b.nombre : id) + '</span>' +
                            '<button type="button" data-quitar="' + k + '" title="Quitar">✕</button>';
          fichas.appendChild(ficha);
        });
        div.appendChild(fichas);
      }

      td.appendChild(div);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  tabla.appendChild(tbody);
  renderPropsCelda();
  renderPaleta();
}

function alineacionCSS(a) {
  return a === 'centro' ? 'center' : a === 'derecha' ? 'right' : a === 'justificado' ? 'justify' : 'left';
}

function celdaSel() {
  if (!S.sel) return null;
  const fila = S.plantilla.filas[S.sel.f];
  return fila ? fila.celdas[S.sel.c] : null;
}

/* --- Interacción con la rejilla ---------------------------------------- */

$('#rejilla').addEventListener('click', e => {
  const quitar = e.target.closest('[data-quitar]');
  if (quitar) {
    const div = quitar.closest('.celda');
    const celda = S.plantilla.filas[+div.dataset.f].celdas[+div.dataset.c];
    celda.bloques.splice(Number(quitar.dataset.quitar), 1);
    renderRejilla();
    return;
  }
  const div = e.target.closest('.celda');
  if (!div) return;
  S.sel = { f: +div.dataset.f, c: +div.dataset.c };
  $$('.celda').forEach(x => x.classList.remove('is-sel'));
  div.classList.add('is-sel');
  renderPropsCelda();
});

$('#rejilla').addEventListener('blur', e => {
  if (!e.target.classList || !e.target.classList.contains('celda__texto')) return;
  const div = e.target.closest('.celda');
  const celda = S.plantilla.filas[+div.dataset.f].celdas[+div.dataset.c];
  celda.texto = e.target.textContent;

}, true);

/* --- Arrastrar y soltar ------------------------------------------------ */

document.addEventListener('dragstart', e => {
  const b = e.target.closest('.bloque');
  if (!b) return;
  e.dataTransfer.setData('text/plain', b.dataset.bloque);
  e.dataTransfer.effectAllowed = 'copy';
  b.classList.add('is-dragging');
});

document.addEventListener('dragend', e => {
  const b = e.target.closest('.bloque');
  if (b) b.classList.remove('is-dragging');
  $$('.celda').forEach(c => c.classList.remove('is-drop'));
});

$('#rejilla').addEventListener('dragover', e => {
  const div = e.target.closest('.celda');
  if (!div) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  div.classList.add('is-drop');
});

$('#rejilla').addEventListener('dragleave', e => {
  const div = e.target.closest('.celda');
  if (div) div.classList.remove('is-drop');
});

$('#rejilla').addEventListener('drop', e => {
  const div = e.target.closest('.celda');
  if (!div) return;
  e.preventDefault();
  div.classList.remove('is-drop');
  const id = e.dataTransfer.getData('text/plain');
  if (!id || !MAPA_BLOQUES[id]) return;
  insertarBloqueEn(+div.dataset.f, +div.dataset.c, id);
});

// Doble clic en la paleta: inserta en la celda seleccionada.
$('#paletaLista').addEventListener('dblclick', e => {
  const b = e.target.closest('.bloque');
  if (!b) return;
  if (!S.sel) return toast('Selecciona primero una celda de la tabla.', 'alerta');
  insertarBloqueEn(S.sel.f, S.sel.c, b.dataset.bloque);
});

function insertarBloqueEn(f, c, id) {
  const celda = S.plantilla.filas[f].celdas[c];
  celda.bloques = celda.bloques || [];
  if (celda.bloques.indexOf(id) !== -1) return toast('Ese bloque ya está en la celda.', 'alerta');
  celda.bloques.push(id);
  S.sel = { f, c };
  renderRejilla();
}

/* --- Barra de herramientas de la tabla --------------------------------- */

$('.tablero__barra').addEventListener('click', e => {
  const btn = e.target.closest('[data-accion]');
  if (!btn) return;
  const P = S.plantilla;
  const celda = celdaSel();

  switch (btn.dataset.accion) {
    case 'fila-add':
      P.filas.splice(S.sel ? S.sel.f + 1 : P.filas.length, 0, filaNueva(P.columnas));
      break;

    case 'fila-del':
      if (P.filas.length <= 1) return toast('Debe quedar al menos una fila.', 'alerta');
      P.filas.splice(S.sel ? S.sel.f : P.filas.length - 1, 1);
      S.sel = null;
      normalizarSpans();
      break;

    case 'col-add':
      P.columnas++;
      P.filas.forEach(f => f.celdas.push(celdaNueva()));
      P.anchos = repartirAnchos(P.columnas);
      break;

    case 'col-del':
      if (P.columnas <= 1) return toast('Debe quedar al menos una columna.', 'alerta');
      P.columnas--;
      P.filas.forEach(f => f.celdas.pop());
      P.anchos = repartirAnchos(P.columnas);
      normalizarSpans();
      S.sel = null;
      break;

    case 'fusionar-h': fusionar('h'); break;
    case 'fusionar-v': fusionar('v'); break;

    case 'separar':
      if (!celda) return toast('Selecciona una celda.', 'alerta');
      for (let r = S.sel.f; r < S.sel.f + celda.rowspan; r++) {
        for (let k = S.sel.c; k < S.sel.c + celda.colspan; k++) {
          if (r === S.sel.f && k === S.sel.c) continue;
          if (P.filas[r] && P.filas[r].celdas[k]) P.filas[r].celdas[k].oculta = false;
        }
      }
      celda.colspan = 1; celda.rowspan = 1;
      break;

    case 'encabezado':
      if (!celda) return toast('Selecciona una celda.', 'alerta');
      celda.tipo = celda.tipo === 'encabezado' ? 'normal' : 'encabezado';
      break;

    case 'limpiar-celda':
      if (!celda) return toast('Selecciona una celda.', 'alerta');
      celda.texto = ''; celda.bloques = [];
      break;
  }
  renderRejilla();
});

function repartirAnchos(n) {
  const base = Math.floor(100 / n);
  const anchos = new Array(n).fill(base);
  anchos[n - 1] += 100 - base * n;
  return anchos;
}

/** Recorta spans que se salgan de la rejilla tras borrar filas o columnas. */
function normalizarSpans() {
  const P = S.plantilla;
  P.filas.forEach((fila, f) => {
    fila.celdas.forEach((celda, c) => {
      celda.colspan = Math.min(celda.colspan, P.columnas - c);
      celda.rowspan = Math.min(celda.rowspan, P.filas.length - f);
    });
  });
  // Se recalcula qué celdas quedan cubiertas por una fusión.
  P.filas.forEach(f => f.celdas.forEach(c => { c.oculta = false; }));
  P.filas.forEach((fila, f) => {
    fila.celdas.forEach((celda, c) => {
      if (celda.oculta || (celda.colspan === 1 && celda.rowspan === 1)) return;
      for (let r = f; r < f + celda.rowspan; r++) {
        for (let k = c; k < c + celda.colspan; k++) {
          if (r === f && k === c) continue;
          if (P.filas[r] && P.filas[r].celdas[k]) P.filas[r].celdas[k].oculta = true;
        }
      }
    });
  });
}

function fusionar(direccion) {
  const P = S.plantilla;
  const celda = celdaSel();
  if (!celda) return toast('Selecciona una celda.', 'alerta');
  const { f, c } = S.sel;

  if (direccion === 'h') {
    const destino = c + celda.colspan;
    if (destino >= P.columnas) return toast('No hay columna a la derecha.', 'alerta');
    for (let r = f; r < f + celda.rowspan; r++) {
      const cc = P.filas[r] && P.filas[r].celdas[destino];
      if (!cc || cc.oculta || cc.colspan > 1 || cc.rowspan > 1) {
        return toast('Esa celda ya forma parte de otra combinación.', 'alerta');
      }
    }
    for (let r = f; r < f + celda.rowspan; r++) vaciarYOcultar(P.filas[r].celdas[destino]);
    celda.colspan++;
  } else {
    const destino = f + celda.rowspan;
    if (destino >= P.filas.length) return toast('No hay fila debajo.', 'alerta');
    for (let k = c; k < c + celda.colspan; k++) {
      const cc = P.filas[destino].celdas[k];
      if (!cc || cc.oculta || cc.colspan > 1 || cc.rowspan > 1) {
        return toast('Esa celda ya forma parte de otra combinación.', 'alerta');
      }
    }
    for (let k = c; k < c + celda.colspan; k++) vaciarYOcultar(P.filas[destino].celdas[k]);
    celda.rowspan++;
  }
}

function vaciarYOcultar(celda) {
  celda.oculta = true;
  celda.texto = '';
  celda.bloques = [];
  celda.colspan = 1;
  celda.rowspan = 1;
}

/* --- Panel de propiedades de la celda ---------------------------------- */

function renderPropsCelda() {
  const cont = $('#propsCelda');
  const celda = celdaSel();
  if (!celda) {
    cont.innerHTML = '<p class="vacio">Selecciona una celda de la tabla.</p>';
    return;
  }
  cont.innerHTML =
    '<label class="campo campo--mini"><span>Fondo</span>' +
      '<input type="color" data-cp="fondo" value="' + (celda.estilo.fondo || '#ffffff') + '"></label>' +
    '<label class="campo campo--mini"><span>Texto</span>' +
      '<input type="color" data-cp="color" value="' + (celda.estilo.color || '#1f2430') + '"></label>' +
    '<label class="campo campo--mini"><span>Alineación</span>' +
      '<select data-cp="alineacion">' +
        ['izquierda', 'centro', 'derecha', 'justificado'].map(a =>
          '<option value="' + a + '"' + (celda.estilo.alineacion === a ? ' selected' : '') + '>' + a + '</option>').join('') +
      '</select></label>' +
    '<label class="campo campo--mini"><span>Tamaño</span>' +
      '<input type="number" data-cp="tamano" min="0" max="20" value="' + (celda.estilo.tamano || 0) + '" title="0 = tamaño base"></label>' +
    '<label class="check"><input type="checkbox" data-cp="negrita"' + (celda.estilo.negrita ? ' checked' : '') + '> Negritas</label>' +
    '<div class="props__fila">' +
      '<button class="btn btn--mini" data-cp-accion="reset">Restablecer estilo</button>' +
    '</div>' +
    '<p class="vacio">Fila ' + (S.sel.f + 1) + ', columna ' + (S.sel.c + 1) +
      ' · ' + celda.colspan + '×' + celda.rowspan + '</p>';

  cont.querySelectorAll('[data-cp]').forEach(input => {
    input.addEventListener('change', () => {
      const k = input.dataset.cp;
      celda.estilo[k] = input.type === 'checkbox' ? input.checked
        : input.type === 'number' ? Number(input.value)
        : input.value;
      renderRejilla();
    });
  });
  const reset = cont.querySelector('[data-cp-accion="reset"]');
  if (reset) reset.addEventListener('click', () => {
    celda.estilo = { fondo: '', color: '', negrita: false, alineacion: '', tamano: 0 };
    renderRejilla();
  });
}

function celdaCon(texto, bloques, tipo, estilo) {
  const c = celdaNueva(tipo);
  c.texto = texto || '';
  c.bloques = bloques || [];
  if (estilo) Object.assign(c.estilo, estilo);
  return c;
}

function filaCon(celdas, columnas) {
  while (celdas.length < columnas) celdas.push(celdaNueva());
  return { celdas: celdas.slice(0, columnas) };
}

function aplicarPreajuste(nombre) {
  const P = S.plantilla;
  const p = S.proyecto;
  P.filas = [];

  if (nombre === 'clasica') {
    P.columnas = 4;
    P.anchos = [20, 44, 12, 24];
    P.filas.push(filaCon([
      celdaCon('Fase y momento', [], 'encabezado'),
      celdaCon('Actividades', [], 'encabezado'),
      celdaCon('Tiempo', [], 'encabezado'),
      celdaCon('Evidencias y evaluación', [], 'encabezado')
    ], 4));
    (p ? p.momentos : []).forEach((m, i) => {
      const n = i + 1;
      P.filas.push(filaCon([
        celdaCon('', ['momento_' + n + '_nombre']),
        celdaCon('', ['momento_' + n]),
        celdaCon('', ['momento_' + n + '_tiempo'], null, { alineacion: 'centro' }),
        celdaCon('', [])
      ], 4));
    });
    P.filas.push(filaCon([
      celdaCon('Evaluación', [], 'encabezado'),
      celdaCon('', ['evaluacion_instrumentos', 'evaluacion_criterios']),
      celdaCon('Recursos', [], 'encabezado'),
      celdaCon('', ['recursos'])
    ], 4));

  } else if (nombre === 'sesiones') {
    P.columnas = 4;
    P.anchos = [10, 52, 12, 26];
    P.filas.push(filaCon([
      celdaCon('Sesión', [], 'encabezado'),
      celdaCon('Actividades', [], 'encabezado'),
      celdaCon('Tiempo', [], 'encabezado'),
      celdaCon('Observaciones', [], 'encabezado')
    ], 4));
    ((S.distribucion || {}).sesiones || []).forEach(s => {
      P.filas.push(filaCon([
        celdaCon('Sesión ' + s.numero, [], null, { alineacion: 'centro' }),
        celdaCon('', ['sesion_' + s.numero]),
        celdaCon(minutos(s.minutosUsados), [], null, { alineacion: 'centro' }),
        celdaCon('', [])
      ], 4));
    });

  } else if (nombre === 'fases') {
    P.columnas = 3;
    P.anchos = [34, 33, 33];
    P.filas.push(filaCon([
      celdaCon('Fase 1 · Planeación', [], 'encabezado'),
      celdaCon('Fase 2 · Acción', [], 'encabezado'),
      celdaCon('Fase 3 · Intervención', [], 'encabezado')
    ], 3));
    P.filas.push(filaCon([
      celdaCon('', ['fase_planeacion']),
      celdaCon('', ['fase_accion']),
      celdaCon('', ['fase_intervencion'])
    ], 3));

  } else if (nombre === 'compacta') {
    P.columnas = 2;
    P.anchos = [26, 74];
    [
      ['Proyecto', 'titulo_proyecto'],
      ['Problemática', 'problematica'],
      ['Producto final', 'producto_final'],
      ['Campos formativos', 'campos_formativos'],
      ['Ejes articuladores', 'ejes_articuladores'],
      ['PDA', 'pda'],
      ['Explicación del tema', 'explicacion_resumen'],
      ['Secuencia de actividades', 'agenda_sesiones'],
      ['Evaluación', 'evaluacion_criterios'],
      ['Recursos', 'recursos'],
      ['Adecuaciones', 'adecuaciones']
    ].forEach(([etiqueta, bloqueId]) => {
      P.filas.push(filaCon([
        celdaCon(etiqueta, [], 'encabezado'),
        celdaCon('', [bloqueId])
      ], 2));
    });

  } else { // vacia
    P.columnas = 4;
    P.anchos = repartirAnchos(4);
    for (let i = 0; i < 4; i++) P.filas.push(filaNueva(4));
  }

  S.sel = null;
  normalizarSpans();
}

/* ─────────────────── 8. Paso 4 · Vista previa y documento ── */

/** Resuelve una celda a una lista de párrafos listos para el documento. */
function resolverCelda(celda) {
  const parrafos = [];
  const texto = String(celda.texto || '');

  if (texto.trim()) {
    // Sustituye {{marcador}} por el texto plano del bloque correspondiente.
    const resuelto = texto.replace(/\{\{\s*([\w-]+)\s*\}\}/g, (_, id) => textoPlanoDe(id));
    resuelto.split('\n').forEach(linea => {
      if (linea.trim()) parrafos.push({ tipo: 'texto', texto: linea.trim(), etiqueta: '' });
    });
  }

  (celda.bloques || []).forEach(id => {
    parrafosDe(id).forEach(p => parrafos.push({
      tipo: p.tipo || 'texto',
      texto: p.texto || '',
      etiqueta: p.etiqueta || ''
    }));
  });

  return parrafos;
}

function gridResuelta() {
  return {
    columnas: S.plantilla.columnas,
    anchos: S.plantilla.anchos,
    filas: S.plantilla.filas.map(fila => ({
      celdas: fila.celdas.map(celda => ({
        colspan: celda.colspan,
        rowspan: celda.rowspan,
        oculta: !!celda.oculta,
        tipo: celda.tipo,
        estilo: celda.estilo,
        parrafos: celda.oculta ? [] : resolverCelda(celda)
      }))
    }))
  };
}

function metaResuelta() {
  const m = S.plantilla.meta;
  const etiquetas = {
    docente: 'Docente', escuela: 'Escuela', cct: 'CCT', zona: 'Zona / sector',
    ciclo: 'Ciclo escolar', gradoGrupo: 'Grado y grupo', asignatura: 'Asignatura',
    periodo: 'Periodo', director: 'Director(a)'
  };
  return Object.keys(etiquetas)
    .filter(k => String(m[k] || '').trim())
    .map(k => ({ etiqueta: etiquetas[k], valor: m[k] }));
}

function anexosResueltos() {
  if (!$('#optAnexos').checked) return [];
  const anexos = [];
  const agregar = (titulo, ids) => {
    const parrafos = [];
    ids.forEach(id => parrafosDe(id).forEach(p => parrafos.push(p)));
    if (parrafos.length) anexos.push({ titulo, parrafos });
  };
  agregar('Explicación del tema', ['explicacion_resumen', 'explicacion_relevancia', 'conceptos_clave']);
  agregar('Evaluación', ['evaluacion_enfoque', 'evaluacion_instrumentos', 'evaluacion_criterios', 'evaluacion_indicadores']);
  agregar('Recursos y adecuaciones', ['recursos', 'adecuaciones', 'vinculacion_familias']);
  agregar('Agenda de sesiones', ['agenda_sesiones']);
  return anexos;
}

function parrafosAHtml(parrafos, estilo) {
  let html = '';
  let enLista = false;
  parrafos.forEach(p => {
    const contenido = p.etiqueta && p.texto
      ? '<b>' + escapar(p.etiqueta) + ':</b> ' + escapar(p.texto)
      : escapar(p.etiqueta || p.texto);
    if (p.tipo === 'vineta') {
      if (!enLista) { html += '<ul>'; enLista = true; }
      html += '<li>' + contenido + '</li>';
      return;
    }
    if (enLista) { html += '</ul>'; enLista = false; }
    html += p.tipo === 'titulo'
      ? '<p style="font-weight:700;color:' + estilo.colorPrimario + '">' + contenido + '</p>'
      : '<p>' + contenido + '</p>';
  });
  if (enLista) html += '</ul>';
  return html;
}

function renderPrevia() {
  if (!S.proyecto) return;
  construirBloques();

  const estilo = S.plantilla.estilo;
  const grid = gridResuelta();
  const meta = metaResuelta();
  const nombre = $('#nombreDocumento').value.trim() ||
    ('Planeación · ' + (S.proyecto.tituloProyecto || 'Proyecto comunitario'));

  const borde = estilo.anchoBorde > 0
    ? estilo.anchoBorde + 'px solid ' + estilo.colorBorde
    : 'none';

  let html = '<h3 class="previa__titulo" style="color:' + estilo.colorPrimario + '">' +
    escapar(nombre.toUpperCase()) + '</h3>';

  if (meta.length) {
    html += '<table style="border:' + borde + '"><tbody>';
    for (let i = 0; i < meta.length; i += 2) {
      html += '<tr>';
      [meta[i], meta[i + 1]].forEach(par => {
        if (!par) { html += '<td style="border:' + borde + '"></td><td style="border:' + borde + '"></td>'; return; }
        html += '<td style="border:' + borde + ';background:' + estilo.fondoEncabezado +
                ';color:' + estilo.colorEncabezado + ';font-weight:700">' + escapar(par.etiqueta) + '</td>' +
                '<td style="border:' + borde + '">' + escapar(par.valor) + '</td>';
      });
      html += '</tr>';
    }
    html += '</tbody></table>';
  }

  html += '<table style="border:' + borde + ';font-family:' + estilo.fuente + '"><tbody>';
  grid.filas.forEach(fila => {
    html += '<tr>';
    fila.celdas.forEach(celda => {
      if (celda.oculta) return;
      const ce = celda.estilo || {};
      const fondo = ce.fondo || (celda.tipo === 'encabezado' ? estilo.fondoEncabezado : 'transparent');
      const color = ce.color || (celda.tipo === 'encabezado' ? estilo.colorEncabezado : estilo.colorTexto);
      html += '<td' +
        (celda.colspan > 1 ? ' colspan="' + celda.colspan + '"' : '') +
        (celda.rowspan > 1 ? ' rowspan="' + celda.rowspan + '"' : '') +
        ' style="border:' + borde + ';background:' + fondo + ';color:' + color +
        ';text-align:' + alineacionCSS(ce.alineacion || (celda.tipo === 'encabezado' ? 'centro' : 'izquierda')) +
        ';font-weight:' + (ce.negrita || celda.tipo === 'encabezado' ? 700 : 400) +
        ';font-size:' + ((ce.tamano || estilo.tamano) + 2) + 'px">' +
        parrafosAHtml(celda.parrafos, estilo) + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';

  anexosResueltos().forEach(a => {
    html += '<h4 style="color:' + estilo.colorPrimario + '">' + escapar(a.titulo) + '</h4>' +
            parrafosAHtml(a.parrafos, estilo);
  });

  $('#previa').innerHTML = html;
}

$('#btnGenerarDoc').addEventListener('click', async () => {
  construirBloques();
  const payload = {
    titulo: $('#nombreDocumento').value.trim() || ('Planeación · ' + S.proyecto.tituloProyecto),
    docId: $('#optSobrescribir').checked ? S.docId : '',
    orientacion: S.plantilla.orientacion,
    estilo: S.plantilla.estilo,
    meta: metaResuelta(),
    grid: gridResuelta(),
    anexos: anexosResueltos()
  };

  cargando(true, 'Escribiendo tu documento…', 'Construyendo la tabla en Google Docs.');
  try {
    const doc = await pedir('generarDocumento', payload);
    S.docId = doc.docId;
    S.docUrl = doc.url;

    let extra = '';
    if ($('#optPDF').checked) {
      const pdf = await pedir('exportarPDF', doc.docId);
      extra = '<a href="' + pdf.url + '" target="_blank" rel="noopener">Abrir el PDF</a>';
    }

    $('#resultadoDoc').hidden = false;
    $('#resultadoDoc').innerHTML =
      '<b>Documento listo:</b> ' + escapar(doc.nombre) +
      '<div><a href="' + doc.url + '" target="_blank" rel="noopener">Abrir en Google Docs</a> ' + extra + '</div>' +
      (doc.avisoFusion ? '<small>' + escapar(doc.avisoFusion) + '</small>' : '');

    toast('Documento generado en tu Drive.');
    await guardarTodo(true);
  } catch (err) {
    toast(err.message, 'error', 9000);
  } finally {
    cargando(false);
  }
});

/* ──────────────────── 9. Biblioteca, plantillas y configuración ── */

async function guardarTodo(silencioso) {
  if (!S.proyecto) {
    if (!silencioso) toast('Todavía no hay nada que guardar.', 'alerta');
    return;
  }
  try {
    const res = await pedir('guardarProyecto', {
      id: S.proyecto.id,
      archivoId: S.archivoId,
      proyecto: S.proyecto,
      distribucion: S.distribucion,
      plantilla: S.plantilla,
      docId: S.docId,
      docUrl: S.docUrl
    });
    S.archivoId = res.archivoId;
    if (!silencioso) toast('Planeación guardada en Drive.');
  } catch (err) {
    toast(err.message, 'error');
  }
}

$('#btnGuardar').addEventListener('click', () => guardarTodo(false));

$('#btnBiblioteca').addEventListener('click', async () => {
  abrirModal('#modalBiblioteca');
  const cont = $('#listaBiblioteca');
  cont.innerHTML = '<p class="vacio">Cargando…</p>';
  try {
    const lista = await pedir('listarProyectos');
    if (!lista.length) {
      cont.innerHTML = '<p class="vacio">Aún no has guardado ninguna planeación.</p>';
      return;
    }
    cont.innerHTML = lista.map(x =>
      '<div class="item-lista">' +
        '<div class="item-lista__txt"><b>' + escapar(x.titulo) + '</b>' +
          '<small>' + escapar(x.nivel || '') + ' · actualizada el ' +
          new Date(x.actualizado).toLocaleString('es-MX') + '</small></div>' +
        '<div class="item-lista__acc">' +
          '<button class="btn btn--mini" data-abrir="' + x.archivoId + '">Abrir</button>' +
          '<button class="btn btn--mini" data-duplicar="' + x.archivoId + '">Duplicar</button>' +
          (x.docUrl ? '<a class="btn btn--mini" href="' + x.docUrl + '" target="_blank" rel="noopener">Doc</a>' : '') +
          '<button class="btn btn--mini btn--peligro" data-borrar="' + x.archivoId + '">Papelera</button>' +
        '</div>' +
      '</div>').join('');
  } catch (err) {
    cont.innerHTML = '<p class="vacio">' + escapar(err.message) + '</p>';
  }
});

$('#listaBiblioteca').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-abrir],button[data-duplicar],button[data-borrar]');
  if (!btn) return;

  try {
    if (btn.dataset.abrir) {
      cargando(true, 'Abriendo la planeación…');
      const estado = await pedir('cargarProyecto', btn.dataset.abrir);
      S.proyecto = estado.proyecto;
      S.insumos = estado.proyecto.insumos || {};
      S.distribucion = estado.distribucion || null;
      S.plantilla = estado.plantilla || S.plantilla;
      S.archivoId = estado.archivoId;
      S.docId = estado.docId || '';
      S.docUrl = estado.docUrl || '';
      volcarInsumosEnFormulario();
      volcarEstiloEnControles();
      construirBloques();
      renderPaso2();
      renderRejilla();
      cerrarModal('#modalBiblioteca');
      irAPaso(2);
      toast('Planeación cargada.');
    }

    if (btn.dataset.duplicar) {
      await pedir('duplicarProyecto', btn.dataset.duplicar);
      toast('Copia creada.');
      $('#btnBiblioteca').click();
    }

    if (btn.dataset.borrar) {
      if (!confirm('¿Enviar esta planeación a la papelera de Drive?')) return;
      await pedir('eliminarProyecto', btn.dataset.borrar);
      toast('Enviada a la papelera.');
      $('#btnBiblioteca').click();
    }
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    cargando(false);
  }
});

function volcarInsumosEnFormulario() {
  const f = $('#formInsumos');
  const i = S.insumos || {};
  ['tema', 'nivel', 'grado', 'campoFormativo', 'caracteristicasGrupo', 'recursos',
   'contextoComunitario', 'sesiones', 'minutosPorSesion', 'semanas', 'actividadesPorMomento']
    .forEach(k => { if (f[k] && i[k] != null) f[k].value = i[k]; });
  actualizarChips();
}

function volcarEstiloEnControles() {
  const e = S.plantilla.estilo || {};
  Object.keys(CAMPOS_ESTILO).forEach(id => {
    const valor = e[CAMPOS_ESTILO[id]];
    if (valor != null) $('#' + id).value = valor;
  });
  $('#estiloOrientacion').value = S.plantilla.orientacion || 'vertical';
  $$('#propsMeta [data-meta]').forEach(input => {
    input.value = (S.plantilla.meta || {})[input.dataset.meta] || '';
  });
}

$('#listaPlantillas').addEventListener('click', async e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  try {
    if (btn.dataset.usar) {
      const datos = await pedir('cargarPlantilla', btn.dataset.usar);
      const pl = datos.plantilla || {};
      Object.assign(S.plantilla, {
        orientacion: pl.orientacion || 'vertical',
        columnas: pl.columnas || 4,
        anchos: pl.anchos || repartirAnchos(pl.columnas || 4),
        filas: pl.filas || [],
        estilo: Object.assign(S.plantilla.estilo, pl.estilo || {})
      });
      S.sel = null;
      volcarEstiloEnControles();
      normalizarSpans();
      renderRejilla();
      cerrarModal('#modalPlantillas');
      toast('Maquetado aplicado.');
    }
    if (btn.dataset.borrarPlantilla) {
      await pedir('eliminarPlantilla', btn.dataset.borrarPlantilla);
      $('#btnPlantillasGuardadas').click();
    }
  } catch (err) {
    toast(err.message, 'error');
  }
});

})();
