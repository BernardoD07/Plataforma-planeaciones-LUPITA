<script>
/* ============================================================================
   PlaneacionesLUPITA<3 — lógica de cliente
   ----------------------------------------------------------------------------
   Flujo:
     0. Plantillas  -> galería. Cada plantilla guarda su membrete y, dentro,
                       todas las planeaciones hechas con ella.
     1. Membrete    -> logotipos, textos institucionales y firmas
     2. Datos       -> tablas 1 y 2, capturadas siempre a mano
     3. Proyecto    -> tablas 3 y 4, a mano o con IA (la IA es opcional)
     4. Documento   -> bloques arrastrables, vista previa fiel, Drive y descarga

   El documento se representa como una lista de BLOQUES. El mismo modelo pinta
   la vista previa y viaja al servidor, así que lo que se ve es lo que sale.
   ========================================================================== */

(function () {
'use strict';

/* ═════════════════════════════════════════════════════════════ Utilidades */

const $  = (sel, raiz) => (raiz || document).querySelector(sel);
const $$ = (sel, raiz) => Array.prototype.slice.call((raiz || document).querySelectorAll(sel));

function esc(txt) {
  return String(txt == null ? '' : txt)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/** Texto multilínea -> arreglo de líneas no vacías. */
function lineas(txt) {
  return String(txt == null ? '' : txt)
    .split('\n').map(t => t.trim()).filter(Boolean);
}

let temporizadorToast = null;
function toast(mensaje, clase) {
  const t = $('#toast');
  t.textContent = mensaje;
  t.className = 'toast' + (clase ? ' ' + clase : '');
  t.hidden = false;
  clearTimeout(temporizadorToast);
  temporizadorToast = setTimeout(() => { t.hidden = true; }, clase === 'es-error' ? 7000 : 3800);
}

function cargando(texto) {
  $('#cargandoTexto').textContent = texto || 'Trabajando…';
  $('#cargando').hidden = false;
}
const listo = () => { $('#cargando').hidden = true; };

/**
 * Envoltura de google.script.run como promesa. El servidor devuelve
 * {ok, data|error} en casi todo; algunas funciones devuelven el valor pelado.
 */
function llamar(nombre) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolver, rechazar) => {
    if (!window.google || !google.script || !google.script.run) {
      rechazar(new Error('Esta pantalla solo funciona dentro de la aplicación web.'));
      return;
    }
    // Se conserva el receptor: google.script.run usa `this` internamente.
    const corredor = google.script.run
      .withSuccessHandler(res => {
        if (res && typeof res === 'object' && typeof res.ok === 'boolean') {
          if (res.ok) resolver(res.data);
          else rechazar(new Error(res.error || 'Error desconocido en el servidor.'));
          return;
        }
        resolver(res);
      })
      .withFailureHandler(err => rechazar(new Error((err && err.message) || String(err))));

    if (typeof corredor[nombre] !== 'function') {
      rechazar(new Error('La función «' + nombre + '» no existe en el servidor.'));
      return;
    }
    corredor[nombre].apply(corredor, args);
  });
}

/* ═══════════════════════════════════════════════════════════════ Estado */

const RANURAS_LOGO = [
  { ranura: 'secretaria',  titulo: '1 · Secretaría de Educación' },
  { ranura: 'procedencia', titulo: '2 · Unidad de procedencia' },
  { ranura: 'ensenanza',   titulo: '3 · Unidad de enseñanza' }
];

function plantillaVacia() {
  return {
    nombre: '', id: null, archivoId: null, carpetaId: null,
    imagenes: RANURAS_LOGO.map(r => ({ ranura: r.ranura, driveId: '', dataUrl: '', nombre: '' })),
    altoLogos: 56,
    titulo: '', procedencia: '', cct: '',
    cicloEscolar: CATALOGOS.cicloSugerido || '',
    tituloPlan: 'PLAN DE TRABAJO',
    firmas: (CATALOGOS.firmasPorDefecto || []).map(f => Object.assign({}, f)),
    columnasFirmas: 3
  };
}

/** Todo lo que cambia de una planeación a otra; la plantilla no se toca. */
function planeacionVacia() {
  return {
    id: null, archivoId: null, docId: null,
    // Los valores que no cambian vienen precargados, pero siguen editables.
    datos: {
      escuela: '', turno: 'MATUTINO', cct: '', docente: '',
      practicante: 'Guadalupe Lugo Tinoco',
      nivel: 'Secundaria', gradoGrupo: '', cicloEscolar: '',
      campoFormativo: 'Saberes y pensamiento científico',
      disciplina: '', semanas: '', sesiones: '', tiempoSesion: '', periodo: ''
    },
    contenido: {
      contenido: '', temas: '', pda: '', ejes: [],
      camposVinculados: 'Saberes y pensamiento científico',
      metodologia: '', tecnicas: '', evaluacionFormativa: '', evaluacionSumativa: '',
      numFases: 5
    },
    usarIA: false,
    proyecto: { nombre: '', problematica: '', proposito: '', productoFinal: '' },
    fases: [],
    observaciones: '',
    bloques: null,
    bloquesEditados: false
  };
}

let CATALOGOS = { ejes: [], campos: [], fasesSugeridas: [], firmasPorDefecto: [], cicloSugerido: '' };
let CONFIG = { tieneApiKey: false };
let PLANTILLAS = [];

const E = {
  plantilla: null,
  estilo: {
    fuente: 'Arial', tamano: 9,
    colorPrimario: '#E5397F', colorTexto: '#1F2430',
    colorBorde: '#5B6472', anchoBorde: 1,
    fondoEncabezado: '#FDE7F0', colorEncabezado: '#8A1F4C',
    mostrarPie: true
  },
  orientacion: 'horizontal',
  papel: 'a4'
};
Object.assign(E, planeacionVacia());

let zoom = 1;

/* ═══════════════════════════════════════════════════════════ Mapa de campos */

const CAMPOS_PLANTILLA = {
  plNombre: 'nombre', plTitulo: 'titulo', plProcedencia: 'procedencia',
  plCct: 'cct', plCiclo: 'cicloEscolar', plTituloPlan: 'tituloPlan'
};
const CAMPOS_DATOS = {
  dEscuela: 'escuela', dTurno: 'turno', dCct: 'cct', dDocente: 'docente',
  dPracticante: 'practicante', dNivel: 'nivel', dGradoGrupo: 'gradoGrupo',
  dCiclo: 'cicloEscolar', dCampoFormativo: 'campoFormativo', dDisciplina: 'disciplina',
  dSemanas: 'semanas', dSesiones: 'sesiones', dTiempoSesion: 'tiempoSesion',
  dPeriodo: 'periodo'
};
const CAMPOS_CONTENIDO = {
  cContenido: 'contenido', cTemas: 'temas', cPda: 'pda',
  cCamposVinculados: 'camposVinculados', cMetodologia: 'metodologia',
  cTecnicas: 'tecnicas', cEvalFormativa: 'evaluacionFormativa',
  cEvalSumativa: 'evaluacionSumativa', cNumFases: 'numFases'
};
const CAMPOS_PROYECTO = {
  pNombre: 'nombre', pProblematica: 'problematica',
  pProposito: 'proposito', pProductoFinal: 'productoFinal'
};
const CAMPOS_ESTILO = {
  esFuente: 'fuente', esTamano: 'tamano', esFondoEncabezado: 'fondoEncabezado',
  esColorEncabezado: 'colorEncabezado', esColorBorde: 'colorBorde',
  esAnchoBorde: 'anchoBorde'
};

/** Enlaza inputs con un objeto del estado; el objeto se resuelve al vuelo. */
function enlazar(mapa, obtenerDestino, alCambiar) {
  Object.keys(mapa).forEach(id => {
    const el = $('#' + id);
    if (!el) return;
    el.addEventListener('input', () => {
      const destino = obtenerDestino();
      if (!destino) return;
      destino[mapa[id]] = el.value;
      if (alCambiar) alCambiar(mapa[id], el.value);
    });
  });
}

function volcar(mapa, origen) {
  if (!origen) return;
  Object.keys(mapa).forEach(id => {
    const el = $('#' + id);
    if (!el) return;
    const v = origen[mapa[id]];
    el.value = (v === null || v === undefined) ? '' : v;
  });
}

/* ═══════════════════════════════════════════════════════════════ Arranque */

document.addEventListener('DOMContentLoaded', iniciar);

function iniciar() {
  prepararCorazon();
  prepararNavegacion();
  prepararGaleria();
  prepararPlantilla();
  prepararDatos();
  prepararProyecto();
  prepararEditor();
  prepararModales();

  E.plantilla = plantillaVacia();

  Promise.all([
    llamar('obtenerCatalogos').catch(() => CATALOGOS),
    llamar('obtenerConfiguracion').catch(() => CONFIG),
    llamar('obtenerPlantillaActiva').catch(() => null)
  ]).then(([cat, cfg, plantilla]) => {
    CATALOGOS = cat || CATALOGOS;
    CONFIG = cfg || CONFIG;

    pintarEjes();
    pintarCampos();
    actualizarEstadoIA();

    E.plantilla = plantillaVacia();
    if (plantilla) aplicarPlantilla(plantilla);
    else volcarPlantilla();

    sincronizarCiclo();
    volcar(CAMPOS_DATOS, E.datos);
    volcar(CAMPOS_CONTENIDO, E.contenido);
    if (!E.fases.length) ajustarNumeroDeFases(Number(E.contenido.numFases) || 5);

    return cargarGaleria(plantilla ? plantilla.archivoId : null);
  }).catch(err => toast(err.message, 'es-error'));
}

function sincronizarCiclo() {
  if (!E.datos.cicloEscolar && E.plantilla) {
    E.datos.cicloEscolar = E.plantilla.cicloEscolar || '';
    $('#dCiclo').value = E.datos.cicloEscolar;
  }
}

/* ═════════════════════════════════════════════════ Bienvenida con corazón */

function prepararCorazon() {
  sembrarCorazones();
  $('#btnEntrar').addEventListener('click', cerrarCorazon);
  $('#btnCorazon').addEventListener('click', abrirCorazon);
  setTimeout(() => {
    if (!$('#corazonazo').classList.contains('is-fuera')) cerrarCorazon();
  }, 7000);
}

function sembrarCorazones() {
  const simbolos = ['💖', '💗', '🧁', '💕', '🍫', '💘'];
  let html = '';
  for (let i = 0; i < 16; i++) {
    const izq = Math.random() * 100;
    const dur = 7 + Math.random() * 7;
    const esp = Math.random() * 6;
    const tam = 16 + Math.random() * 20;
    html += '<span style="left:' + izq.toFixed(1) + '%;font-size:' + tam.toFixed(0) +
            'px;animation-duration:' + dur.toFixed(1) + 's;animation-delay:' + esp.toFixed(1) + 's">' +
            simbolos[i % simbolos.length] + '</span>';
  }
  $('#cieloCorazones').innerHTML = html;
}

function cerrarCorazon() { $('#corazonazo').classList.add('is-fuera'); }
function abrirCorazon() { $('#corazonazo').classList.remove('is-fuera'); }

/* ══════════════════════════════════════════════════════════ Navegación */

function prepararNavegacion() {
  $$('#stepper .paso').forEach(b => {
    b.addEventListener('click', () => irA(Number(b.dataset.paso)));
  });
  $$('[data-ir]').forEach(b => {
    b.addEventListener('click', () => irA(Number(b.dataset.ir)));
  });
  $('#btnGuardar').addEventListener('click', () => guardarPlaneacion(false));
  $('#btnInicio').addEventListener('click', () => irA(0));
  $('#btnDrive').addEventListener('click', abrirDrive);
}

function irA(paso) {
  // Las planeaciones viven dentro de una plantilla: sin plantilla guardada no
  // hay dónde ponerlas.
  if (paso >= 2 && !E.plantilla.archivoId) {
    toast('Primero guarda la plantilla: las planeaciones se guardan dentro de ella.', 'es-error');
    paso = 1;
  }

  if (paso === 0) refrescarInicio();
  if (paso === 2) pintarAvisoPlantilla();
  if (paso === 4) prepararDocumento();

  $$('.vista').forEach(v => v.classList.remove('is-active'));
  $('#vista-' + paso).classList.add('is-active');

  $$('#stepper .paso').forEach(b => {
    const n = Number(b.dataset.paso);
    b.classList.toggle('is-active', n === paso);
    b.classList.toggle('is-hecho', n < paso);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function abrirDrive() {
  cargando('Buscando tu carpeta…');
  llamar('obtenerCarpetaDrive')
    .then(c => window.open(c.url, '_blank'))
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

/* ═══════════════════════════════════ PASO 0 · Galería de plantillas */

function prepararGaleria() {
  $('#btnNuevaPlantilla').addEventListener('click', nuevaPlantilla);
  $('#btnNuevaPlaneacion').addEventListener('click', nuevaPlaneacion);
  $('#btnEditarMembrete').addEventListener('click', () => irA(1));
  $('#btnDuplicarPlantillaAbierta').addEventListener('click', () => duplicarPlantilla(E.plantilla.archivoId));
}

function cargarGaleria(abrirEsta) {
  return llamar('listarPlantillas')
    .then(lista => {
      PLANTILLAS = lista || [];
      pintarGaleria();
      if (abrirEsta) return pintarPanelPlaneaciones();
    })
    .catch(err => toast(err.message, 'es-error'));
}

/** Al volver al inicio se recuentan plantillas y planeaciones. */
function refrescarInicio() {
  cargarGaleria(E.plantilla && E.plantilla.archivoId ? E.plantilla.archivoId : null);
}

/** «1 planeación» / «3 planeaciones» */
function plural(n, singular, pluralForma) {
  return n + ' ' + (n === 1 ? singular : pluralForma);
}

function pintarGaleria() {
  const activa = E.plantilla && E.plantilla.archivoId;

  const tarjetas = PLANTILLAS.map(p => '' +
    '<article class="plantilla-card' + (p.archivoId === activa ? ' is-activa' : '') + '" data-id="' + p.archivoId + '">' +
      (p.archivoId === activa ? '<span class="plantilla-card__cinta">EN USO</span>' : '') +
      '<div class="plantilla-card__logos">' +
        (p.logos ? '<span>🖼️ ' + plural(p.logos, 'logotipo', 'logotipos') + '</span>'
                 : '<span>Sin logotipos todavía</span>') +
        '<span>· ✍️ ' + plural(p.firmas || 0, 'firma', 'firmas') + '</span>' +
      '</div>' +
      '<div class="plantilla-card__nombre">' + esc(p.nombre) + '</div>' +
      '<div class="plantilla-card__meta">' +
        '<span>' + esc([p.procedencia, p.cct].filter(Boolean).join(' · ') || 'Sin unidad de procedencia') + '</span>' +
        '<span>' + esc(p.cicloEscolar ? 'Ciclo ' + p.cicloEscolar : 'Sin ciclo escolar') + '</span>' +
        '<span>Actualizada el ' + esc(p.actualizado) + '</span>' +
      '</div>' +
      '<span class="plantilla-card__cuenta">📚 ' +
        plural(p.planeaciones || 0, 'planeación', 'planeaciones') + '</span>' +
      '<div class="plantilla-card__acciones">' +
        '<button class="btn btn--primary btn--mini" data-abrir="' + p.archivoId + '" type="button">Abrir</button>' +
        '<button class="btn btn--mini" data-duplicar="' + p.archivoId + '" type="button">🧬 Duplicar</button>' +
        '<button class="btn btn--mini btn--peligro" data-borrar="' + p.archivoId + '" type="button">Papelera</button>' +
      '</div>' +
    '</article>').join('');

  $('#galeriaPlantillas').innerHTML = tarjetas +
    '<button class="plantilla-nueva" id="tarjetaNueva" type="button">' +
      '<span>💗</span>Crear una plantilla nueva' +
    '</button>';

  $('#tarjetaNueva').addEventListener('click', nuevaPlantilla);
  $$('#galeriaPlantillas [data-abrir]').forEach(b =>
    b.addEventListener('click', () => abrirPlantilla(b.dataset.abrir)));
  $$('#galeriaPlantillas [data-duplicar]').forEach(b =>
    b.addEventListener('click', () => duplicarPlantilla(b.dataset.duplicar)));
  $$('#galeriaPlantillas [data-borrar]').forEach(b =>
    b.addEventListener('click', () => borrarPlantilla(b.dataset.borrar)));
}

function nuevaPlantilla() {
  E.plantilla = plantillaVacia();
  Object.assign(E, planeacionVacia());

  volcarPlantilla();
  volcar(CAMPOS_DATOS, E.datos);
  volcar(CAMPOS_CONTENIDO, E.contenido);
  volcar(CAMPOS_PROYECTO, E.proyecto);
  $('#observaciones').value = '';
  pintarEjes();
  ajustarNumeroDeFases(5);

  $('#panelPlaneaciones').hidden = true;
  irA(1);
  toast('Plantilla nueva: ponle nombre y arma el membrete. 💗');
}

function abrirPlantilla(archivoId) {
  cargando('Abriendo la plantilla…');
  llamar('cargarPlantilla', archivoId)
    .then(p => {
      aplicarPlantilla(p);
      Object.assign(E, planeacionVacia());
      sincronizarCiclo();
      volcar(CAMPOS_DATOS, E.datos);
      volcar(CAMPOS_CONTENIDO, E.contenido);
      volcar(CAMPOS_PROYECTO, E.proyecto);
      $('#observaciones').value = '';
      pintarEjes();
      ajustarNumeroDeFases(Number(E.contenido.numFases) || 5);

      pintarGaleria();
      return pintarPanelPlaneaciones().then(() => {
        $('#panelPlaneaciones').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    })
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

/** Lista las planeaciones que viven dentro de la plantilla abierta. */
function pintarPanelPlaneaciones() {
  const panel = $('#panelPlaneaciones');
  panel.hidden = false;
  $('#tituloPlantillaAbierta').textContent = '📚 Planeaciones de «' + (E.plantilla.nombre || 'sin nombre') + '»';
  $('#subPlantillaAbierta').textContent =
    [E.plantilla.procedencia, E.plantilla.cicloEscolar ? 'ciclo ' + E.plantilla.cicloEscolar : '']
      .filter(Boolean).join(' · ');

  const caja = $('#listaPlaneacionesPlantilla');
  caja.innerHTML = '<p class="lista-vacia">Cargando…</p>';

  return llamar('listarPlaneaciones', E.plantilla.carpetaId)
    .then(lista => {
      if (!lista.length) {
        caja.innerHTML = '<p class="lista-vacia">Esta plantilla todavía no tiene planeaciones. ' +
          'Crea la primera con «＋ Nueva planeación».</p>';
        return;
      }
      caja.innerHTML = lista.map(p => '' +
        '<div class="planeacion-item">' +
          '<div class="planeacion-item__datos">' +
            '<b>' + esc(p.proyecto || p.nombre) + '</b>' +
            '<small>' + esc([p.gradoGrupo, p.disciplina, p.periodo].filter(Boolean).join(' · ')) + '</small>' +
            '<small>' + p.fases + ' fases · guardada el ' + esc(p.actualizado) + '</small>' +
          '</div>' +
          '<div class="planeacion-item__acciones">' +
            '<button class="btn btn--primary btn--mini" data-abrir="' + p.archivoId + '" type="button">Abrir</button>' +
            '<button class="btn btn--mini" data-duplicar="' + p.archivoId + '" type="button">Duplicar</button>' +
            '<button class="btn btn--mini btn--peligro" data-borrar="' + p.archivoId + '" type="button">Papelera</button>' +
          '</div>' +
        '</div>').join('');

      $$('[data-abrir]', caja).forEach(b => b.addEventListener('click', () => abrirPlaneacion(b.dataset.abrir)));
      $$('[data-duplicar]', caja).forEach(b => b.addEventListener('click', () => {
        cargando('Duplicando…');
        llamar('duplicarPlaneacion', b.dataset.duplicar)
          .then(() => { toast('Copia creada.', 'es-exito'); return pintarPanelPlaneaciones(); })
          .catch(err => toast(err.message, 'es-error'))
          .finally(listo);
      }));
      $$('[data-borrar]', caja).forEach(b => b.addEventListener('click', () => {
        if (!window.confirm('¿Mandar esta planeación a la papelera de Drive?')) return;
        llamar('eliminarPlaneacion', b.dataset.borrar)
          .then(() => { toast('Enviada a la papelera.'); return pintarPanelPlaneaciones(); })
          .catch(err => toast(err.message, 'es-error'));
      }));
    })
    .catch(err => { caja.innerHTML = '<p class="lista-vacia">' + esc(err.message) + '</p>'; });
}

function nuevaPlaneacion() {
  if (!E.plantilla.archivoId) {
    toast('Guarda la plantilla antes de crear planeaciones.', 'es-error');
    return;
  }
  Object.assign(E, planeacionVacia());
  sincronizarCiclo();

  volcar(CAMPOS_DATOS, E.datos);
  volcar(CAMPOS_CONTENIDO, E.contenido);
  volcar(CAMPOS_PROYECTO, E.proyecto);
  $('#observaciones').value = '';
  $('#usarIA').checked = false;
  $('#iaPanel').hidden = true;
  $('#nombreDocumento').value = '';
  $('#resultadoDoc').hidden = true;
  pintarEjes();
  ajustarNumeroDeFases(Number(E.contenido.numFases) || 5);

  irA(2);
  toast('Planeación nueva dentro de «' + E.plantilla.nombre + '».');
}

function duplicarPlantilla(archivoId) {
  const original = PLANTILLAS.find(p => p.archivoId === archivoId);
  const sugerido = ((original && original.nombre) || E.plantilla.nombre || 'Plantilla') + ' (copia)';
  const nombre = window.prompt('¿Cómo se va a llamar la copia?', sugerido);
  if (nombre === null) return;

  cargando('Duplicando la plantilla…');
  llamar('duplicarPlantilla', archivoId, nombre.trim())
    .then(p => {
      aplicarPlantilla(p);
      Object.assign(E, planeacionVacia());
      sincronizarCiclo();
      volcar(CAMPOS_DATOS, E.datos);
      volcar(CAMPOS_CONTENIDO, E.contenido);
      pintarEjes();
      ajustarNumeroDeFases(5);
      return cargarGaleria(p.archivoId).then(() => {
        irA(1);
        toast('Copia creada: edítala a tu gusto. 💗', 'es-exito');
      });
    })
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

function borrarPlantilla(archivoId) {
  const p = PLANTILLAS.find(x => x.archivoId === archivoId) || {};
  const aviso = p.planeaciones
    ? 'Se irán a la papelera la plantilla «' + p.nombre + '» y sus ' + p.planeaciones +
      ' planeación(es). Todo se puede recuperar desde Drive. ¿Continuar?'
    : '¿Mandar la plantilla «' + p.nombre + '» a la papelera?';
  if (!window.confirm(aviso)) return;

  cargando('Enviando a la papelera…');
  llamar('eliminarPlantilla', archivoId)
    .then(() => {
      if (E.plantilla.archivoId === archivoId) {
        E.plantilla = plantillaVacia();
        volcarPlantilla();
        $('#panelPlaneaciones').hidden = true;
      }
      return cargarGaleria();
    })
    .then(() => toast('Enviada a la papelera de Drive.'))
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

function pintarAvisoPlantilla() {
  const aviso = $('#avisoPlantilla');
  if (!E.plantilla.archivoId) { aviso.hidden = true; return; }
  aviso.hidden = false;
  aviso.innerHTML = '🏫 Esta planeación se guardará dentro de la plantilla <b>' +
    esc(E.plantilla.nombre) + '</b>.' +
    ' <button class="btn btn--mini" id="btnCambiarPlantilla" type="button">Cambiar de plantilla</button>';
  $('#btnCambiarPlantilla').addEventListener('click', () => irA(0));
}

/* ═══════════════════════════════════ PASO 1 · Membrete de la plantilla */

function prepararPlantilla() {
  pintarRanurasLogo();
  enlazar(CAMPOS_PLANTILLA, () => E.plantilla, (campo, valor) => {
    // El ciclo escolar del membrete alimenta el de la tabla 1.
    if (campo === 'cicloEscolar') {
      E.datos.cicloEscolar = valor;
      $('#dCiclo').value = valor;
    }
  });

  const rango = $('#altoLogos');
  rango.addEventListener('input', () => {
    E.plantilla.altoLogos = Number(rango.value);
    $('#chipAltoLogos').textContent = rango.value + ' pt';
  });

  $('#columnasFirmas').addEventListener('change', e => {
    E.plantilla.columnasFirmas = Number(e.target.value);
  });
  $('#btnAgregarFirma').addEventListener('click', () => {
    E.plantilla.firmas.push({ rol: 'REVISÓ', detalle: '', nombre: '' });
    pintarFirmas();
  });

  $('#btnGuardarPlantilla').addEventListener('click', guardarPlantilla);
}

function pintarRanurasLogo() {
  const imagenes = (E.plantilla && E.plantilla.imagenes) || [];

  $('#logosGrid').innerHTML = RANURAS_LOGO.map((r, i) => {
    const img = imagenes[i] || {};
    const lleno = !!(img.dataUrl || img.driveId);
    return '' +
      '<div class="logo-ranura' + (lleno ? ' is-lleno' : '') + '" data-ranura="' + r.ranura + '">' +
        '<div class="logo-ranura__titulo">' + esc(r.titulo) + '</div>' +
        '<div class="logo-ranura__marco">' +
          (img.dataUrl
            ? '<img src="' + img.dataUrl + '" alt="' + esc(r.titulo) + '">'
            : '<span class="logo-ranura__vacio">🖼️</span>') +
        '</div>' +
        '<div class="logo-ranura__acciones">' +
          '<label class="btn btn--mini">' + (lleno ? 'Cambiar' : 'Subir imagen') +
            '<input type="file" accept="image/*" data-indice="' + i + '"></label>' +
          (lleno ? '<button class="btn btn--mini btn--peligro" data-quitar="' + i + '" type="button">Quitar</button>' : '') +
        '</div>' +
      '</div>';
  }).join('');

  $$('#logosGrid input[type=file]').forEach(inp => {
    inp.addEventListener('change', e => subirLogo(Number(inp.dataset.indice), e.target.files[0]));
  });
  $$('#logosGrid [data-quitar]').forEach(btn => {
    btn.addEventListener('click', () => quitarLogo(Number(btn.dataset.quitar)));
  });
}

function subirLogo(indice, archivo) {
  if (!archivo) return;
  if (archivo.size > 3 * 1024 * 1024) {
    toast('La imagen pesa más de 3 MB. Redúcela antes de subirla.', 'es-error');
    return;
  }

  const lector = new FileReader();
  lector.onload = () => {
    const dataUrl = lector.result;
    const ranura = RANURAS_LOGO[indice].ranura;

    cargando('Subiendo la imagen a tu Drive…');
    llamar('subirImagen', ranura, archivo.name, dataUrl)
      .then(res => {
        E.plantilla.imagenes[indice] = {
          ranura: ranura, driveId: res.driveId, dataUrl: dataUrl, nombre: res.nombre
        };
        pintarRanurasLogo();
        toast('Imagen lista.', 'es-exito');
      })
      .catch(err => toast(err.message, 'es-error'))
      .finally(listo);
  };
  lector.readAsDataURL(archivo);
}

function quitarLogo(indice) {
  const img = E.plantilla.imagenes[indice];
  E.plantilla.imagenes[indice] = { ranura: RANURAS_LOGO[indice].ranura, driveId: '', dataUrl: '', nombre: '' };
  pintarRanurasLogo();
  // La imagen puede estar compartida con una copia de la plantilla: no se borra
  // de Drive, solo se suelta de esta plantilla.
}

function pintarFirmas() {
  const lista = $('#firmasLista');
  const firmas = (E.plantilla && E.plantilla.firmas) || [];

  if (!firmas.length) {
    lista.innerHTML = '<p class="lista-vacia">Sin firmas. Agrega al menos una con el botón de arriba.</p>';
    return;
  }

  lista.innerHTML = firmas.map((f, i) => '' +
    '<div class="firma" data-i="' + i + '">' +
      '<span class="firma__orden">' + (i + 1) + '</span>' +
      '<label class="campo campo--mini"><span>Encabezado</span>' +
        '<input type="text" data-campo="rol" value="' + esc(f.rol) + '" placeholder="ELABORÓ DOCENTE EN FORMACIÓN"></label>' +
      '<label class="campo campo--mini"><span>Cargo o detalle</span>' +
        '<input type="text" data-campo="detalle" value="' + esc(f.detalle) + '" placeholder="TITULAR DE LA DISCIPLINA"></label>' +
      '<label class="campo campo--mini"><span>Nombre bajo la línea</span>' +
        '<input type="text" data-campo="nombre" value="' + esc(f.nombre) + '" placeholder="C. GUADALUPE LUGO TINOCO"></label>' +
      '<button class="btn btn--mini btn--peligro" data-borrar="' + i + '" type="button">✕</button>' +
    '</div>').join('');

  $$('#firmasLista .firma').forEach(fila => {
    const i = Number(fila.dataset.i);
    $$('input[data-campo]', fila).forEach(inp => {
      inp.addEventListener('input', () => { E.plantilla.firmas[i][inp.dataset.campo] = inp.value; });
    });
  });
  $$('#firmasLista [data-borrar]').forEach(btn => {
    btn.addEventListener('click', () => {
      E.plantilla.firmas.splice(Number(btn.dataset.borrar), 1);
      pintarFirmas();
    });
  });
}

function aplicarPlantilla(p) {
  E.plantilla = Object.assign(plantillaVacia(), p);

  // Se garantizan las tres ranuras aunque la plantilla guardada traiga menos.
  E.plantilla.imagenes = RANURAS_LOGO.map((r, i) => {
    const img = (p.imagenes || []).find(x => x && x.ranura === r.ranura) || (p.imagenes || [])[i] || {};
    return { ranura: r.ranura, driveId: img.driveId || '', dataUrl: img.dataUrl || '', nombre: img.nombre || '' };
  });
  E.plantilla.firmas = (p.firmas || []).map(f => Object.assign({ rol: '', detalle: '', nombre: '' }, f));

  volcarPlantilla();
}

function volcarPlantilla() {
  volcar(CAMPOS_PLANTILLA, E.plantilla);
  $('#altoLogos').value = E.plantilla.altoLogos || 56;
  $('#chipAltoLogos').textContent = (E.plantilla.altoLogos || 56) + ' pt';
  $('#columnasFirmas').value = String(E.plantilla.columnasFirmas || 3);
  pintarRanurasLogo();
  pintarFirmas();
}

/** Copia de la plantilla lista para viajar al servidor (sin base64). */
function plantillaParaGuardar() {
  return Object.assign({}, E.plantilla, {
    imagenes: E.plantilla.imagenes.map(i => ({ ranura: i.ranura, driveId: i.driveId, nombre: i.nombre }))
  });
}

function guardarPlantilla() {
  if (!$('#plNombre').value.trim()) {
    toast('Ponle nombre a la plantilla para poder guardarla.', 'es-error');
    $('#plNombre').focus();
    return;
  }
  E.plantilla.nombre = $('#plNombre').value.trim();

  cargando('Guardando la plantilla…');
  llamar('guardarPlantilla', plantillaParaGuardar())
    .then(res => {
      E.plantilla.archivoId = res.archivoId;
      E.plantilla.id = res.id;
      E.plantilla.carpetaId = res.carpetaId;
      toast('Plantilla «' + res.nombre + '» guardada. 💗', 'es-exito');
      return cargarGaleria();
    })
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

/* ══════════════════════════════════════════════ PASO 2 · Tablas 1 y 2 */

function prepararDatos() {
  enlazar(CAMPOS_DATOS, () => E.datos);
  enlazar(CAMPOS_CONTENIDO, () => E.contenido, campo => {
    if (campo === 'numFases') ajustarNumeroDeFases(Number(E.contenido.numFases) || 1);
  });
  volcar(CAMPOS_DATOS, E.datos);
  volcar(CAMPOS_CONTENIDO, E.contenido);
}

function pintarEjes() {
  $('#ejesLista').innerHTML = (CATALOGOS.ejes || []).map((eje, i) => '' +
    '<label class="eje' + (E.contenido.ejes.indexOf(eje) !== -1 ? ' is-marcado' : '') + '">' +
      '<input type="checkbox" value="' + esc(eje) + '"' +
        (E.contenido.ejes.indexOf(eje) !== -1 ? ' checked' : '') + '>' +
      '<span>' + (i + 1) + '. ' + esc(eje) + '</span>' +
    '</label>').join('');

  $$('#ejesLista input').forEach(inp => {
    inp.addEventListener('change', () => {
      inp.closest('.eje').classList.toggle('is-marcado', inp.checked);
      E.contenido.ejes = $$('#ejesLista input:checked').map(x => x.value);
    });
  });
}

function pintarCampos() {
  $('#listaCampos').innerHTML = (CATALOGOS.campos || [])
    .map(c => '<option value="' + esc(c) + '">').join('');
}

/* ═════════════════════════════════════════ PASO 3 · Tablas 3 y 4 (+ IA) */

function prepararProyecto() {
  enlazar(CAMPOS_PROYECTO, () => E.proyecto);

  $('#observaciones').addEventListener('input', e => { E.observaciones = e.target.value; });

  $('#usarIA').addEventListener('change', e => {
    E.usarIA = e.target.checked;
    $('#iaPanel').hidden = !E.usarIA;
    pintarFases();
  });

  $('#btnGenerarIA').addEventListener('click', generarConIA);
  $('#btnAgregarFase').addEventListener('click', () => {
    E.fases.push(faseNueva(E.fases.length));
    E.contenido.numFases = E.fases.length;
    $('#cNumFases').value = E.fases.length;
    pintarFases();
  });
  $('#btnBalancear').addEventListener('click', balancearSesiones);
}

function faseNueva(indice) {
  const sug = (CATALOGOS.fasesSugeridas || [])[indice] || {};
  return {
    numero: indice + 1,
    fase: sug.fase || ('Fase ' + (indice + 1) + '.'),
    construir: sug.construir || 'Actividades',
    actividades: [],
    recursos: [],
    sesiones: 0
  };
}

function ajustarNumeroDeFases(cuantas) {
  cuantas = Math.min(Math.max(cuantas || 1, 1), 10);
  while (E.fases.length < cuantas) E.fases.push(faseNueva(E.fases.length));
  if (E.fases.length > cuantas) E.fases.length = cuantas;
  E.fases.forEach((f, i) => { f.numero = i + 1; });
  pintarFases();
}

function pintarFases() {
  const lista = $('#fasesLista');

  if (!E.fases.length) {
    lista.innerHTML = '<p class="lista-vacia">Aún no hay fases. Ajusta el número en la tabla 2 o agrega una.</p>';
    actualizarChipSesiones();
    return;
  }

  lista.innerHTML = E.fases.map((f, i) => '' +
    '<article class="fase" data-i="' + i + '">' +
      '<header class="fase__cabecera">' +
        '<span class="fase__num">' + (i + 1) + '</span>' +
        '<span class="fase__titulo">' + esc(f.fase || 'Fase ' + (i + 1)) + '</span>' +
        '<span class="fase__acciones">' +
          (E.usarIA ? '<button class="btn btn--mini" data-regenerar="' + i + '" type="button">✨ Otras ideas</button>' : '') +
          '<button class="btn btn--mini" data-subir="' + i + '" type="button" ' + (i === 0 ? 'disabled' : '') + '>↑</button>' +
          '<button class="btn btn--mini" data-bajar="' + i + '" type="button" ' + (i === E.fases.length - 1 ? 'disabled' : '') + '>↓</button>' +
          '<button class="btn btn--mini btn--peligro" data-borrar="' + i + '" type="button">✕</button>' +
        '</span>' +
      '</header>' +
      '<div class="fase__cuerpo">' +
        '<label class="campo"><span>Nombre de la fase</span>' +
          '<input type="text" data-campo="fase" value="' + esc(f.fase) + '"></label>' +
        '<label class="campo"><span>Encabezado de la columna que se construye</span>' +
          '<input type="text" data-campo="construir" value="' + esc(f.construir) + '" ' +
          'placeholder="Selección del tema, Representación, Metacognición…"></label>' +
        '<label class="campo campo--ancho"><span>Actividades · una por línea</span>' +
          '<textarea data-campo="actividades" rows="6">' + esc((f.actividades || []).join('\n')) + '</textarea></label>' +
        '<label class="campo"><span>Recursos y materiales · uno por línea</span>' +
          '<textarea data-campo="recursos" rows="5">' + esc((f.recursos || []).join('\n')) + '</textarea></label>' +
        '<label class="campo"><span>Número de sesiones</span>' +
          '<input type="number" min="0" max="99" data-campo="sesiones" value="' + (Number(f.sesiones) || 0) + '"></label>' +
      '</div>' +
    '</article>').join('');

  $$('#fasesLista .fase').forEach(art => {
    const i = Number(art.dataset.i);
    $$('[data-campo]', art).forEach(el => {
      el.addEventListener('input', () => {
        const campo = el.dataset.campo;
        if (campo === 'actividades' || campo === 'recursos') E.fases[i][campo] = lineas(el.value);
        else if (campo === 'sesiones') { E.fases[i].sesiones = Number(el.value) || 0; actualizarChipSesiones(); }
        else E.fases[i][campo] = el.value;

        if (campo === 'fase') $('.fase__titulo', art).textContent = el.value || 'Fase ' + (i + 1);
      });
    });
  });

  $$('#fasesLista [data-borrar]').forEach(b => b.addEventListener('click', () => {
    E.fases.splice(Number(b.dataset.borrar), 1);
    E.contenido.numFases = E.fases.length;
    $('#cNumFases').value = E.fases.length;
    pintarFases();
  }));
  $$('#fasesLista [data-subir]').forEach(b => b.addEventListener('click', () => moverFase(Number(b.dataset.subir), -1)));
  $$('#fasesLista [data-bajar]').forEach(b => b.addEventListener('click', () => moverFase(Number(b.dataset.bajar), 1)));
  $$('#fasesLista [data-regenerar]').forEach(b => b.addEventListener('click', () => regenerarFase(Number(b.dataset.regenerar))));

  actualizarChipSesiones();
}

function moverFase(i, salto) {
  const destino = i + salto;
  if (destino < 0 || destino >= E.fases.length) return;
  const [f] = E.fases.splice(i, 1);
  E.fases.splice(destino, 0, f);
  E.fases.forEach((x, n) => { x.numero = n + 1; });
  pintarFases();
}

function actualizarChipSesiones() {
  const asignadas = E.fases.reduce((s, f) => s + (Number(f.sesiones) || 0), 0);
  const total = Number(E.datos.sesiones) || 0;
  const chip = $('#chipSesiones');
  chip.textContent = asignadas + ' / ' + (total || '—') + ' sesiones';
  chip.className = 'chip' + (total && asignadas === total ? ' chip--ok' : (total ? ' chip--alerta' : ''));
}

function balancearSesiones() {
  const total = Number(E.datos.sesiones) || 0;
  if (!total) { toast('Primero captura el total de sesiones en la tabla 1.', 'es-error'); return; }
  if (!E.fases.length) { toast('Agrega al menos una fase.', 'es-error'); return; }

  cargando('Repartiendo las sesiones…');
  llamar('balancearSesiones', E.fases, total, E.datos.tiempoSesion)
    .then(res => {
      E.fases = res.fases;
      pintarFases();
      toast('Sesiones repartidas: ' + res.resumen.asignadas + ' de ' + total +
            ' (' + res.resumen.tiempoLegible + ').', 'es-exito');
    })
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

function actualizarEstadoIA() {
  const chip = $('#chipEstadoIA');
  if (CONFIG.tieneApiKey) {
    chip.textContent = 'Listo · ' + (CONFIG.proveedor || 'gemini') + ' · ' + (CONFIG.modelo || '');
    chip.className = 'chip chip--ok';
    $('#btnGenerarIA').disabled = false;
  } else {
    chip.textContent = 'Sin API key · configúrala en ⚙️ para usar la IA';
    chip.className = 'chip chip--alerta';
    $('#btnGenerarIA').disabled = true;
  }
}

function generarConIA() {
  if (!CONFIG.tieneApiKey) { toast('Configura una API key en ⚙️ Configuración.', 'es-error'); return; }

  const opciones = {
    numFases: Number(E.contenido.numFases) || E.fases.length || 5,
    actividadesPorFase: Number($('#iaActividades').value) || 5,
    enfoque: $('#iaEnfoque').value
  };

  cargando('La IA está redactando el proyecto y sus fases…');
  llamar('generarProyecto', E.datos, E.contenido, opciones)
    .then(res => {
      E.proyecto = res.proyecto;
      E.fases = res.fases;
      E.contenido.numFases = res.fases.length;
      $('#cNumFases').value = res.fases.length;

      volcar(CAMPOS_PROYECTO, E.proyecto);
      pintarFases();
      E.bloquesEditados = false;
      toast('Listo: revisa y corrige lo que quieras antes de generar el documento.', 'es-exito');
    })
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

function regenerarFase(indice) {
  cargando('Buscando otras ideas para la fase ' + (indice + 1) + '…');
  llamar('regenerarFase', E.datos, E.contenido, E.proyecto, E.fases, indice)
    .then(fase => {
      const sesiones = E.fases[indice].sesiones;
      E.fases[indice] = Object.assign(fase, { numero: indice + 1, sesiones: fase.sesiones || sesiones });
      pintarFases();
      toast('Fase ' + (indice + 1) + ' actualizada.', 'es-exito');
    })
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

/* ══════════════════════════════════ PASO 4 · Bloques del documento */

/** Rellena una fila expandiendo los colspan con celdas ocultas. */
function fila(celdas, columnas) {
  const out = [];
  celdas.forEach(c => {
    out.push(c);
    const cs = Number(c.colspan) || 1;
    for (let i = 1; i < cs; i++) out.push({ oculta: true });
  });
  while (out.length < columnas) out.push({});
  return { celdas: out.slice(0, columnas) };
}

const enc = (texto, extra) => Object.assign({ texto: texto, encabezado: true }, extra || {});
const val = (texto, extra) => Object.assign({ texto: texto || '' }, extra || {});

/** Construye el documento completo a partir del estado. */
function construirBloques() {
  const P = E.plantilla, D = E.datos, C = E.contenido;
  const bloques = [];

  /* Membrete ------------------------------------------------------------ */
  bloques.push({
    id: 'logos', tipo: 'logos', nombre: 'Logotipos', icono: '🖼️', oculto: false,
    alto: Number(P.altoLogos) || 56,
    imagenes: P.imagenes.filter(i => i.driveId || i.dataUrl)
  });

  const lineasEncabezado = [];
  lineas(P.titulo).forEach(t => lineasEncabezado.push({ texto: t.toUpperCase(), tamano: 10 }));

  const procedencia = [P.procedencia, P.cct].filter(Boolean).join('  ').trim();
  const ciclo = P.cicloEscolar ? 'CICLO ESCOLAR ' + P.cicloEscolar : '';
  if (procedencia || ciclo) {
    lineasEncabezado.push({ texto: [procedencia, ciclo].filter(Boolean).join('   ·   ').toUpperCase(), tamano: 10 });
  }
  if (P.tituloPlan) {
    lineasEncabezado.push({ texto: P.tituloPlan.toUpperCase(), tamano: 13, espacioAntes: 6, espacioDespues: 6 });
  }

  bloques.push({
    id: 'membrete', tipo: 'texto', nombre: 'Encabezado institucional', icono: '🏛️',
    oculto: false, lineas: lineasEncabezado
  });

  /* Tabla 1 · datos institucionales ------------------------------------- */
  bloques.push({
    id: 'tabla1', tipo: 'tabla', nombre: 'Tabla 1 · Datos institucionales', icono: '🏫',
    oculto: false, columnas: 6, anchos: [15, 18, 15, 18, 16, 18],
    filas: [
      fila([enc(D.escuela || 'NOMBRE DE LA ESCUELA', { colspan: 6, tamano: 11 })], 6),
      fila([enc('TURNO'), val(D.turno, { colspan: 2 }), enc('C.C.T.'), val(D.cct, { colspan: 2 })], 6),
      fila([enc('DOCENTE'), val(D.docente, { colspan: 5 })], 6),
      fila([enc('PRACTICANTE'), val(D.practicante, { colspan: 5 })], 6),
      fila([enc('Nivel escolar'), val(D.nivel), enc('Grado y grupo'), val(D.gradoGrupo),
            enc('Campo formativo'), val(D.campoFormativo)], 6),
      fila([enc('Disciplina'), val(D.disciplina), enc('Ciclo escolar'), val(D.cicloEscolar),
            enc('Periodo'), val(D.periodo)], 6),
      fila([enc('Semanas'), val(D.semanas), enc('Sesiones'), val(D.sesiones),
            enc('Tiempo por sesión'), val(D.tiempoSesion)], 6)
    ]
  });

  /* Tabla 2 · contenido curricular -------------------------------------- */
  bloques.push({
    id: 'tabla2a', tipo: 'tabla', nombre: 'Tabla 2 · Contenido y PDA', icono: '📖',
    oculto: false, columnas: 2, anchos: [24, 76],
    filas: [
      fila([enc('CONTENIDO'), val(C.contenido)], 2),
      fila([enc('TEMAS'), val(C.temas, { vinetas: true })], 2),
      fila([enc('PROCESO DE DESARROLLO DE APRENDIZAJE'), val(C.pda, { vinetas: true })], 2)
    ]
  });

  bloques.push({
    id: 'tabla2b', tipo: 'tabla', nombre: 'Ejes y campos vinculados', icono: '🧭',
    oculto: false, columnas: 2, anchos: [50, 50],
    filas: [
      fila([enc('EJES ARTICULADORES'), enc('CAMPOS FORMATIVOS CON QUE SE VINCULA')], 2),
      fila([val((C.ejes || []).join('\n'), { vinetas: true }), val(C.camposVinculados)], 2)
    ]
  });

  bloques.push({
    id: 'tabla2c', tipo: 'tabla', nombre: 'Metodología y técnicas', icono: '🧰',
    oculto: false, columnas: 2, anchos: [50, 50],
    filas: [
      fila([enc('METODOLOGÍA'), enc('TÉCNICAS')], 2),
      fila([val(C.metodologia, { vinetas: true }), val(C.tecnicas, { vinetas: true })], 2)
    ]
  });

  bloques.push({
    id: 'tabla2d', tipo: 'tabla', nombre: 'Evaluación', icono: '✅',
    oculto: false, columnas: 2, anchos: [50, 50],
    filas: [
      fila([enc('EVALUACIÓN FORMATIVA'), enc('EVALUACIÓN SUMATIVA')], 2),
      fila([val(C.evaluacionFormativa, { vinetas: true }), val(C.evaluacionSumativa, { vinetas: true })], 2)
    ]
  });

  /* Tabla 3 · el proyecto ----------------------------------------------- */
  bloques.push({
    id: 'tabla3', tipo: 'tabla', nombre: 'Tabla 3 · El proyecto', icono: '🎯',
    oculto: false, columnas: 2, anchos: [30, 70],
    filas: [
      fila([enc('Nombre del proyecto'), val(E.proyecto.nombre)], 2),
      fila([enc('Problemática o tema de interés de los alumnos'), val(E.proyecto.problematica)], 2),
      fila([enc('Propósito'), val(E.proyecto.proposito)], 2),
      fila([enc('Producto final esperado'), val(E.proyecto.productoFinal)], 2)
    ]
  });

  /* Tabla 4 · fases ------------------------------------------------------ */
  const filasFases = [];
  E.fases.forEach((f, i) => {
    filasFases.push(fila([
      enc('FASE DEL PROYECTO ' + (i + 1)),
      enc(f.construir || 'ACTIVIDADES'),
      enc('RECURSOS Y MATERIALES'),
      enc('NÚMERO DE SESIONES')
    ], 4));
    filasFases.push(fila([
      val(f.fase, { negrita: true }),
      val((f.actividades || []).join('\n'), { vinetas: true }),
      val((f.recursos || []).join('\n'), { vinetas: true }),
      val((Number(f.sesiones) || 0) + ' sesiones', { alineacion: 'centro' })
    ], 4));
  });

  bloques.push({
    id: 'tabla4', tipo: 'tabla', nombre: 'Tabla 4 · Fases del proyecto', icono: '🗂️',
    oculto: false, columnas: 4, anchos: [21, 47, 18, 14],
    filas: filasFases.length ? filasFases : [fila([enc('FASE DEL PROYECTO 1'), enc('ACTIVIDADES'), enc('RECURSOS Y MATERIALES'), enc('NÚMERO DE SESIONES')], 4)]
  });

  /* Observaciones y firmas ---------------------------------------------- */
  bloques.push({
    id: 'observaciones', tipo: 'tabla', nombre: 'Observaciones', icono: '📝',
    oculto: false, columnas: 2, anchos: [18, 82],
    filas: [fila([enc('OBSERVACIONES'), val(E.observaciones)], 2)]
  });

  bloques.push({ id: 'espacioFirmas', tipo: 'espacio', nombre: 'Espacio antes de firmas', icono: '␣', oculto: false, alto: 18 });

  bloques.push({
    id: 'firmas', tipo: 'firmas', nombre: 'Firmas', icono: '✍️', oculto: false,
    columnas: Number(P.columnasFirmas) || 3,
    items: (P.firmas || []).map(f => Object.assign({}, f))
  });

  return bloques;
}

/**
 * Rehace el contenido conservando el orden y la visibilidad que el docente ya
 * hubiera definido en el editor.
 */
function fusionarPreferencias(nuevos, viejos) {
  if (!viejos || !viejos.length) return nuevos;

  const previos = {};
  viejos.forEach((b, i) => { previos[b.id] = { orden: i, oculto: !!b.oculto }; });

  nuevos.forEach(b => {
    if (previos[b.id]) b.oculto = previos[b.id].oculto;
  });
  nuevos.sort((a, b) => {
    const oa = previos[a.id] ? previos[a.id].orden : 999;
    const ob = previos[b.id] ? previos[b.id].orden : 999;
    return oa - ob;
  });
  return nuevos;
}

function prepararDocumento() {
  if (!E.bloques || !E.bloquesEditados) {
    E.bloques = fusionarPreferencias(construirBloques(), E.bloques);
  }
  if (!$('#nombreDocumento').value) {
    $('#nombreDocumento').value = nombreSugerido();
  }
  pintarListaBloques();
  pintarHoja();
}

function nombreSugerido() {
  return [
    E.plantilla.tituloPlan || 'Plan de trabajo',
    E.datos.gradoGrupo, E.datos.disciplina, E.proyecto.nombre
  ].filter(Boolean).join(' · ').substring(0, 110);
}

/* ─────────────────────────────────────────────── Panel de bloques */

function prepararEditor() {
  enlazar(CAMPOS_ESTILO, () => E.estilo, () => pintarHoja());

  $('#esOrientacion').addEventListener('change', e => { E.orientacion = e.target.value; pintarHoja(); });
  $('#esPapel').addEventListener('change', e => { E.papel = e.target.value; pintarHoja(); });

  $('#btnZoomMas').addEventListener('click', () => cambiarZoom(0.1));
  $('#btnZoomMenos').addEventListener('click', () => cambiarZoom(-0.1));

  $('#btnRehacer').addEventListener('click', () => {

        !window.confirm('Se perderán los cambios que hiciste a mano en la vista previa. ¿Continuar?')) return;
    E.bloques = fusionarPreferencias(construirBloques(), E.bloques);
    E.bloquesEditados = false;
    pintarListaBloques();

  });

  $('#btnConfirmar').addEventListener('click', confirmarYGenerar);

function cambiarZoom(delta) {
  zoom = Math.min(Math.max(zoom + delta, 0.4), 1.6);
  $('#chipZoom').textContent = Math.round(zoom * 100) + ' %';
  $('#hoja').style.transform = 'scale(' + zoom + ')';
}

function pintarListaBloques() {
  $('#listaBloques').innerHTML = (E.bloques || []).map(b => '' +
    '<li class="bloque-item' + (b.oculto ? ' is-oculto' : '') + '" draggable="true" data-id="' + b.id + '">' +
      '<span class="bloque-item__asa">⠿</span>' +
      '<span class="bloque-item__nombre">' + (b.icono || '▫️') + ' ' + esc(b.nombre) + '</span>' +
      '<button class="bloque-item__ojo" data-ojo="' + b.id + '" type="button" ' +
        'title="' + (b.oculto ? 'Mostrar' : 'Ocultar') + '">' + (b.oculto ? '🚫' : '👁️') + '</button>' +
    '</li>').join('');

  $$('#listaBloques [data-ojo]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const b = E.bloques.find(x => x.id === btn.dataset.ojo);
      b.oculto = !b.oculto;
      pintarListaBloques();
      pintarHoja();
    });
  });

  activarArrastre($$('#listaBloques .bloque-item'), 'bloque-item');
}

/* ─────────────────────────────────────────────── Arrastre de bloques */

let idArrastrado = null;

function activarArrastre(elementos, clase) {
  elementos.forEach(el => {
    el.addEventListener('dragstart', ev => {
      idArrastrado = el.dataset.id;
      el.classList.add('is-arrastrando');
      ev.dataTransfer.effectAllowed = 'move';
      try { ev.dataTransfer.setData('text/plain', idArrastrado); } catch (e) { /* IE */ }
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('is-arrastrando');
      $$('.' + clase).forEach(x => x.classList.remove('is-destino'));
      idArrastrado = null;
    });
    el.addEventListener('dragover', ev => {
      if (!idArrastrado || idArrastrado === el.dataset.id) return;
      ev.preventDefault();
      ev.dataTransfer.dropEffect = 'move';
      el.classList.add('is-destino');
    });
    el.addEventListener('dragleave', () => el.classList.remove('is-destino'));
    el.addEventListener('drop', ev => {
      ev.preventDefault();
      el.classList.remove('is-destino');
      reordenarBloques(idArrastrado, el.dataset.id);
    });
  });
}

function reordenarBloques(idOrigen, idDestino) {
  if (!idOrigen || !idDestino || idOrigen === idDestino) return;

  const desde = E.bloques.findIndex(b => b.id === idOrigen);
  const hasta = E.bloques.findIndex(b => b.id === idDestino);
  if (desde === -1 || hasta === -1) return;

  const [b] = E.bloques.splice(desde, 1);
  E.bloques.splice(hasta, 0, b);

  pintarListaBloques();
  pintarHoja();
}

/* ─────────────────────────────────────────────── Vista previa (la hoja) */

function pintarHoja() {
  const hoja = $('#hoja');
  const es = E.estilo;

  hoja.classList.toggle('es-vertical', E.orientacion === 'vertical');
  hoja.style.fontFamily = es.fuente + ', Arial, sans-serif';
  hoja.style.fontSize = (Number(es.tamano) || 9) + 'pt';

  $('#chipHoja').textContent = (E.papel === 'carta' ? 'Carta' : 'A4') + ' ' +
    (E.orientacion === 'vertical' ? 'vertical' : 'horizontal');

  hoja.innerHTML = (E.bloques || []).map(b => '' +
    '<div class="bloque' + (b.oculto ? ' is-oculto' : '') + '" data-id="' + b.id + '">' +
      '<span class="bloque__asa" draggable="true">⠿ ' + esc(b.nombre) + '</span>' +
      cuerpoBloque(b) +
    '</div>').join('');

  aplicarEstilosDeTabla();
  activarArrastreEnHoja();
  activarEdicionEnHoja();
}

function cuerpoBloque(b) {
  switch (b.tipo) {
    case 'logos':   return htmlLogos(b);
    case 'texto':   return htmlTexto(b);
    case 'tabla':   return htmlTabla(b);
    case 'firmas':  return htmlFirmas(b);
    case 'espacio': return '<div style="height:' + (Number(b.alto) || 8) + 'px"></div>';
    default:        return '';
  }
}

function htmlLogos(b) {
  if (!b.imagenes || !b.imagenes.length) {
    return '<div class="hoja-logos"><div class="hoja-logos__hueco">Sin logotipos · súbelos en el paso «Membrete»</div></div>';
  }
  return '<div class="hoja-logos">' + b.imagenes.map(img =>
    '<figure>' + (img.dataUrl
      ? '<img src="' + img.dataUrl + '" style="height:' + (Number(b.alto) || 56) + 'px">'
      : '<span class="hoja-logos__hueco">Imagen en Drive</span>') + '</figure>'
  ).join('') + '</div>';
}

function htmlTexto(b) {
  return '<div class="hoja-texto">' + (b.lineas || []).map((l, i) =>
    '<p class="celda-editable" contenteditable="true" data-linea="' + i + '" ' +
    'style="font-size:' + (Number(l.tamano) || 10) + 'pt">' + esc(l.texto) + '</p>'
  ).join('') + '</div>';
}

function htmlTabla(b) {
  const anchos = b.anchos && b.anchos.length === b.columnas ? b.anchos : null;
  let h = '<table' + (b.sinBordes ? ' class="sin-bordes"' : '') + '>';

  if (anchos) h += '<colgroup>' + anchos.map(a => '<col style="width:' + a + '%">').join('') + '</colgroup>';

  (b.filas || []).forEach((f, ri) => {
    h += '<tr>';
    (f.celdas || []).forEach((c, ci) => {
      if (c.oculta) return;
      const attrs = [];
      if (Number(c.colspan) > 1) attrs.push('colspan="' + Number(c.colspan) + '"');
      if (Number(c.rowspan) > 1) attrs.push('rowspan="' + Number(c.rowspan) + '"');

      const estilos = [];
      if (c.alineacion) estilos.push('text-align:' + (c.alineacion === 'centro' ? 'center' : c.alineacion === 'derecha' ? 'right' : 'left'));
      if (c.negrita) estilos.push('font-weight:700');
      if (c.tamano) estilos.push('font-size:' + c.tamano + 'pt');
      if (c.fondo) estilos.push('background:' + c.fondo);
      if (c.color) estilos.push('color:' + c.color);

      h += '<td class="celda-editable' + (c.encabezado ? ' es-encabezado' : '') + '" ' +
           attrs.join(' ') + ' contenteditable="true" ' +
           'data-fila="' + ri + '" data-celda="' + ci + '"' +
           (estilos.length ? ' style="' + estilos.join(';') + '"' : '') + '>' +
           contenidoCelda(c) + '</td>';
    });
    h += '</tr>';
  });

  return h + '</table>';
}

function contenidoCelda(c) {
  const partes = lineas(c.texto);
  if (!partes.length) return '<p class="linea"><br></p>';
  if (c.vinetas && partes.length > 1) {
    return '<ul class="lineas-vineta">' + partes.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>';
  }
  return partes.map(t => '<p class="linea">' + esc(t) + '</p>').join('');
}

function htmlFirmas(b) {
  const cols = Number(b.columnas) || 3;
  return '<div class="hoja-firmas" style="grid-template-columns:repeat(' + cols + ',1fr)">' +
    (b.items || []).map((f, i) => '' +
      '<div class="hoja-firma">' +
        '<div class="hoja-firma__rol celda-editable" contenteditable="true" data-firma="' + i + '" data-campo="rol">' + esc(f.rol) + '</div>' +
        '<div class="hoja-firma__detalle celda-editable" contenteditable="true" data-firma="' + i + '" data-campo="detalle">' + esc(f.detalle) + '</div>' +
        '<div class="hoja-firma__linea"></div>' +
        '<div class="hoja-firma__nombre celda-editable" contenteditable="true" data-firma="' + i + '" data-campo="nombre">' + esc(f.nombre) + '</div>' +
      '</div>').join('') +
  '</div>';
}

/** Los colores del tema se aplican a la vista previa igual que al documento. */
function aplicarEstilosDeTabla() {
  const es = E.estilo;
  const grosor = Number(es.anchoBorde) >= 0 ? Number(es.anchoBorde) : 1;

  $$('#hoja td').forEach(td => {
    td.style.border = grosor > 0 ? (grosor + 'px solid ' + es.colorBorde) : '0';
    if (td.classList.contains('es-encabezado')) {
      td.style.background = es.fondoEncabezado;
      td.style.color = es.colorEncabezado;
    }
  });
  $$('#hoja table.sin-bordes td').forEach(td => { td.style.border = '0'; });
}

function activarArrastreEnHoja() {
  $$('#hoja .bloque').forEach(bloque => {
    const asa = $('.bloque__asa', bloque);

    asa.addEventListener('dragstart', ev => {
      idArrastrado = bloque.dataset.id;
      bloque.classList.add('is-arrastrando');
      ev.dataTransfer.effectAllowed = 'move';
      try { ev.dataTransfer.setData('text/plain', idArrastrado); } catch (e) { /* IE */ }
    });
    asa.addEventListener('dragend', () => {
      bloque.classList.remove('is-arrastrando');
      $$('#hoja .bloque').forEach(x => x.classList.remove('is-destino'));
      idArrastrado = null;
    });

    bloque.addEventListener('dragover', ev => {
      if (!idArrastrado || idArrastrado === bloque.dataset.id) return;
      ev.preventDefault();
      ev.dataTransfer.dropEffect = 'move';
      bloque.classList.add('is-destino');
    });
    bloque.addEventListener('dragleave', () => bloque.classList.remove('is-destino'));
    bloque.addEventListener('drop', ev => {
      ev.preventDefault();
      bloque.classList.remove('is-destino');
      reordenarBloques(idArrastrado, bloque.dataset.id);
    });
  });
}

/** Cada celda editable escribe de vuelta en el bloque correspondiente. */
function activarEdicionEnHoja() {
  $$('#hoja .bloque').forEach(divBloque => {
    const bloque = E.bloques.find(b => b.id === divBloque.dataset.id);
    if (!bloque) return;

    $$('.celda-editable', divBloque).forEach(el => {
      el.addEventListener('blur', () => {
        const texto = textoDe(el);

        if (el.dataset.linea !== undefined) {
          bloque.lineas[Number(el.dataset.linea)].texto = texto;
        } else if (el.dataset.firma !== undefined) {
          bloque.items[Number(el.dataset.firma)][el.dataset.campo] = texto;
        } else if (el.dataset.fila !== undefined) {
          const celda = bloque.filas[Number(el.dataset.fila)].celdas[Number(el.dataset.celda)];
          if (celda) celda.texto = texto;
        }
        E.bloquesEditados = true;
      });

      // Enter dentro de una celda crea otro renglón, no envía nada.
      el.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' && !ev.shiftKey && el.tagName === 'P') {
          ev.preventDefault();
          document.execCommand('insertLineBreak');
        }
      });
    });
  });
}

/** innerText normalizado: quita renglones vacíos de sobra y espacios duros. */
function textoDe(el) {
  return (el.innerText || '')
    .replace(/ /g, ' ')
    .split('\n').map(t => t.trim())
    .filter((t, i, a) => t || (i > 0 && i < a.length - 1))
    .join('\n').trim();
}

/* ══════════════════════════════════════════ Confirmar, guardar, descargar */

function confirmarYGenerar() {
  if (!E.bloques || !E.bloques.length) { toast('No hay nada que generar.', 'es-error'); return; }
  if (!E.datos.escuela) { toast('Falta el nombre de la escuela (tabla 1).', 'es-error'); return; }

  const payload = {
    titulo: $('#nombreDocumento').value.trim() || nombreSugerido(),
    docId: $('#optSobrescribir').checked ? E.docId : null,
    orientacion: E.orientacion,
    papel: E.papel,
    estilo: E.estilo,
    bloques: E.bloques.filter(b => !b.oculto)
  };

  cargando('Escribiendo la planeación en tu Drive…');
  llamar('generarDocumento', payload)
    .then(res => {
      E.docId = res.docId;
      mostrarResultado(res);
      return guardarPlaneacion(true);
    })
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

function mostrarResultado(res) {
  const caja = $('#resultadoDoc');
  caja.hidden = false;
  caja.innerHTML = '' +
    '<h4>🎉 Planeación lista</h4>' +
    '<p>Se guardó en tu Drive como <b>' + esc(res.nombre) + '</b>.</p>' +
    '<div class="resultado__acciones">' +
      '<a class="btn btn--primary" href="' + esc(res.url) + '" target="_blank" rel="noopener">📄 Abrir en Google Docs</a>' +
      '<button class="btn btn--secundario" id="btnDescargarPdf" type="button">⬇️ Descargar PDF</button>' +
      '<button class="btn btn--ghost" id="btnDescargarWord" type="button">⬇️ Descargar Word</button>' +
    '</div>' +
    (res.avisoFusion ? '<p class="resultado__aviso">⚠️ ' + esc(res.avisoFusion) + '</p>' : '');

  $('#btnDescargarPdf').addEventListener('click', () => descargar('pdf'));
  $('#btnDescargarWord').addEventListener('click', () => descargar('docx'));
  caja.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function descargar(formato) {
  if (!E.docId) { toast('Primero genera el documento.', 'es-error'); return; }

  cargando('Preparando el ' + formato.toUpperCase() + '…');
  llamar('descargarDocumento', E.docId, formato)
    .then(archivo => {
      const bytes = atob(archivo.base64);
      const buffer = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) buffer[i] = bytes.charCodeAt(i);

      const url = URL.createObjectURL(new Blob([buffer], { type: archivo.tipo }));
      const a = document.createElement('a');
      a.href = url;
      a.download = archivo.nombre;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('Descarga iniciada.', 'es-exito');
    })
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

function guardarPlaneacion(silencioso) {
  if (!E.plantilla.archivoId) {
    toast('Guarda primero la plantilla: las planeaciones viven dentro de ella.', 'es-error');
    return Promise.resolve(null);
  }

  const estado = {
    id: E.id, archivoId: E.archivoId, docId: E.docId,
    plantilla: plantillaParaGuardar(),
    datos: E.datos, contenido: E.contenido, usarIA: E.usarIA,
    proyecto: E.proyecto, fases: E.fases, observaciones: E.observaciones,
    estilo: E.estilo, orientacion: E.orientacion, papel: E.papel,
    bloques: E.bloquesEditados ? E.bloques : null,
    bloquesEditados: E.bloquesEditados
  };

  if (!silencioso) cargando('Guardando la planeación…');
  return llamar('guardarPlaneacion', estado)
    .then(res => {
      E.archivoId = res.archivoId;
      if (res.carpetaId) E.plantilla.carpetaId = res.carpetaId;
      if (!silencioso) toast('Planeación guardada dentro de «' + E.plantilla.nombre + '». 💗', 'es-exito');
      return res;
    })
    .catch(err => { toast(err.message, 'es-error'); })
    .finally(() => { if (!silencioso) listo(); });
}

function abrirPlaneacion(archivoId) {
  cargando('Abriendo la planeación…');
  llamar('cargarPlaneacion', archivoId)
    .then(estado => {
      const base = planeacionVacia();
      E.id = estado.id;
      E.archivoId = estado.archivoId;
      E.docId = estado.docId || null;
      E.datos = Object.assign(base.datos, estado.datos || {});
      E.contenido = Object.assign(base.contenido, estado.contenido || {});
      E.proyecto = Object.assign(base.proyecto, estado.proyecto || {});
      E.fases = estado.fases || [];
      E.observaciones = estado.observaciones || '';
      E.usarIA = !!estado.usarIA;
      E.estilo = Object.assign(E.estilo, estado.estilo || {});
      E.orientacion = estado.orientacion || 'horizontal';
      E.papel = estado.papel || 'a4';
      E.bloques = estado.bloques || null;
      E.bloquesEditados = !!estado.bloquesEditados;

      volcar(CAMPOS_DATOS, E.datos);
      volcar(CAMPOS_CONTENIDO, E.contenido);
      volcar(CAMPOS_PROYECTO, E.proyecto);
      volcar(CAMPOS_ESTILO, E.estilo);
      $('#observaciones').value = E.observaciones;
      $('#usarIA').checked = E.usarIA;
      $('#iaPanel').hidden = !E.usarIA;
      $('#esOrientacion').value = E.orientacion;
      $('#esPapel').value = E.papel;
      $('#nombreDocumento').value = '';
      $('#resultadoDoc').hidden = true;

      pintarEjes();
      pintarFases();
      irA(2);
      toast('Planeación cargada.', 'es-exito');
    })
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

/* ═══════════════════════════════════════════════════════════════ Modales */

function prepararModales() {
  $$('[data-cerrar]').forEach(b => {
    b.addEventListener('click', () => { $('#' + b.dataset.cerrar).hidden = true; });
  });

    m.addEventListener('click', ev => { if (ev.target === m) m.hidden = true; });

    if (ev.key === 'Escape') $$('.modal').forEach(m => { m.hidden = true; });
  });

  $('#btnConfig').addEventListener('click', abrirConfig);
  $('#btnGuardarConfig').addEventListener('click', guardarConfig);
  $('#btnProbarIA').addEventListener('click', probarIA);
}

function abrirConfig() {
  $('#cfgProveedor').value = CONFIG.proveedor || 'gemini';
  $('#cfgModelo').value = CONFIG.modelo || '';
  $('#cfgApiKey').value = '';
  $('#cfgEstado').textContent = CONFIG.tieneApiKey
    ? 'Clave guardada: ' + CONFIG.apiKeyMascara + '. Escribe BORRAR para eliminarla.'
    : 'Todavía no hay clave. La IA es opcional.';
  $('#modalConfig').hidden = false;
}

function guardarConfig() {
  cargando('Guardando la configuración…');
  llamar('guardarConfiguracion', {
    proveedor: $('#cfgProveedor').value,
    modelo: $('#cfgModelo').value.trim(),
    apiKey: $('#cfgApiKey').value.trim()
  })
    .then(cfg => {
      CONFIG = cfg;
      actualizarEstadoIA();
      $('#modalConfig').hidden = true;
      toast('Configuración guardada.', 'es-exito');
    })
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

function probarIA() {
  cargando('Probando la conexión…');
  llamar('probarConexionIA')
    .then(r => toast('Respuesta del proveedor: ' + r.respuesta, 'es-exito'))
    .catch(err => toast(err.message, 'es-error'))
    .finally(listo);
}

})();
</script>
