<style>
/* ============================================================================
   PlaneacionesLUPITA<3 — hoja de estilos
   Todo el tema vive en los tokens de :root. Cambia esos valores y cambia la
   aplicación entera sin tocar el resto del archivo.
   ========================================================================== */

:root{
  /* Marca: rosa */
  --marca:        #E5397F;
  --marca-oscura: #B81F5F;
  --marca-clara:  #FF7FB1;
  --marca-tenue:  #FDE7F0;

  /* Acento: lila de cuaderno */
  --acento:       #6C5CE7;
  --acento-tenue: #EFECFF;

  /* Corazón */
  --amor:         #F0357E;
  --amor-claro:   #FF6FA5;
  --amor-oscuro:  #B3195A;

  /* Neutros tibios */
  --fondo:        #FFF6FA;
  --fondo-hundido:#FCEDF4;
  --papel:        #FFFFFF;
  --tinta:        #2C1F2A;
  --tinta-suave:  #6B6577;
  --tinta-tenue:  #A297A9;
  --borde:        #F3DFEA;
  --borde-fuerte: #DFC3D4;

  --exito:        #12876F;
  --exito-tenue:  #E2F7F3;
  --alerta:       #B87A14;
  --alerta-tenue: #FDF3E3;
  --error:        #D0353D;
  --error-tenue:  #FCE9EA;

  --fuente-titulo:'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fuente-texto: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --radio:        18px;
  --radio-mini:   11px;
  --sombra:       0 2px 8px rgba(96,36,66,.06), 0 10px 30px rgba(96,36,66,.08);
  --sombra-alta:  0 24px 60px rgba(96,36,66,.20);
  --transicion:   .18s cubic-bezier(.4,0,.2,1);
}

*{ box-sizing:border-box; }

html,body{ margin:0; padding:0; }

body{
  color:var(--tinta);
  font-family:var(--fuente-texto);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 520px at 88% -8%, var(--marca-tenue) 0%, transparent 62%),
    radial-gradient(760px 420px at -6% 8%, var(--acento-tenue) 0%, transparent 58%),
    var(--fondo);
  background-attachment:fixed;
}

h1,h2,h3{ font-family:var(--fuente-titulo); font-weight:600; margin:0; letter-spacing:-.01em; }
h2{ font-size:22px; }
h3{ font-size:16px; }
p{ margin:0; }

/* ═══════════════════════════════════════════ Bienvenida con el corazón */

.corazonazo{
  position:fixed; inset:0; z-index:120;
  display:grid; place-items:center;
  background:radial-gradient(120% 90% at 50% 10%, #FFE4EF 0%, #FFD1E3 35%, #F7B8D4 100%);
  overflow:hidden;
  transition:opacity .5s ease, visibility .5s ease;
}
.corazonazo.is-fuera{ opacity:0; visibility:hidden; pointer-events:none; }

.corazonazo__cielo{ position:absolute; inset:0; pointer-events:none; }
.corazonazo__cielo span{
  position:absolute; bottom:-40px;
  font-size:22px; opacity:.75;
  animation:flotar linear infinite;
}
@keyframes flotar{
  0%{ transform:translateY(0) rotate(0deg); opacity:0; }
  12%{ opacity:.85; }
  100%{ transform:translateY(-115vh) rotate(30deg); opacity:0; }
}

.corazonazo__centro{ position:relative; text-align:center; padding:24px; }

.corazonazo__latido{
  width:min(180px, 40vw); height:auto;
  filter:drop-shadow(0 14px 30px rgba(179,25,90,.35));
  animation:latir 1.15s ease-in-out infinite;
}
@keyframes latir{
  0%,100%{ transform:scale(1); }
  14%{ transform:scale(1.13); }
  28%{ transform:scale(1); }
  42%{ transform:scale(1.08); }
  56%{ transform:scale(1); }
}

.corazonazo__leyenda{
  margin:22px auto 26px;
  max-width:520px;
  font-family:var(--fuente-titulo);
  font-size:clamp(19px, 3.6vw, 30px);
  font-weight:700;
  line-height:1.32;
  letter-spacing:.01em;
  color:var(--amor-oscuro);
  text-shadow:0 2px 0 rgba(255,255,255,.6);
}

.btn--corazon{
  background:linear-gradient(135deg, var(--amor-claro), var(--amor-oscuro));
  color:#fff; border:0; font-size:15px; padding:13px 26px;
  box-shadow:0 10px 26px rgba(179,25,90,.4);
}
.btn--corazon:hover{ transform:translateY(-2px); box-shadow:0 14px 32px rgba(179,25,90,.48); }

@media (prefers-reduced-motion:reduce){
  .corazonazo__latido{ animation:none; }
  .corazonazo__cielo span{ animation:none; display:none; }
}

/* ═══════════════════════════════════════════════════════ Barra superior */

.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:12px 22px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--borde);
  position:sticky; top:0; z-index:40;
}
.topbar__marca{ display:flex; align-items:center; gap:12px; min-width:0; }
.topbar__icono{
  width:42px; height:42px; flex:none;
  display:grid; place-items:center;
  font-size:20px; border-radius:14px;
  background:linear-gradient(135deg, var(--marca-tenue), var(--acento-tenue));
  box-shadow:inset 0 0 0 1px var(--borde);
}
.topbar__marca strong{
  display:block; font-family:var(--fuente-titulo); font-size:17px; font-weight:700;
  background:linear-gradient(100deg, var(--marca-oscura), var(--marca) 55%, var(--acento));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.topbar__marca small{ display:block; color:var(--tinta-tenue); font-size:12px; }
.topbar__acciones{ display:flex; gap:8px; flex-wrap:wrap; }

/* ═════════════════════════════════════════════════════════════ Botones */

.btn{
  font-family:inherit; font-size:13px; font-weight:600;
  padding:9px 15px; border-radius:var(--radio-mini);
  border:1px solid transparent; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px;
  transition:var(--transicion);
  white-space:nowrap;
}
.btn:active{ transform:translateY(1px); }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

.btn--primary{
  background:linear-gradient(135deg, var(--marca-clara), var(--marca) 55%, var(--marca-oscura));
  color:#fff;
  box-shadow:0 6px 16px rgba(229,57,127,.28);
}
.btn--primary:hover:not(:disabled){ filter:brightness(1.04); box-shadow:0 9px 22px rgba(229,57,127,.35); }

.btn--secundario{ background:var(--acento); color:#fff; }
.btn--secundario:hover:not(:disabled){ filter:brightness(1.08); }

.btn--ghost{ background:rgba(255,255,255,.7); color:var(--tinta-suave); border-color:var(--borde); }
.btn--ghost:hover:not(:disabled){ background:var(--marca-tenue); color:var(--marca-oscura); border-color:var(--marca-clara); }

.btn--grande{ font-size:15px; padding:13px 24px; }
.btn--mini{ font-size:12px; padding:6px 11px; background:var(--fondo-hundido); color:var(--tinta-suave); }
.btn--mini:hover:not(:disabled){ background:var(--marca-tenue); color:var(--marca-oscura); }
.btn--peligro{ background:transparent; color:var(--error); border-color:#F3C9CC; }
.btn--peligro:hover:not(:disabled){ background:var(--error-tenue); }

/* ══════════════════════════════════════════════════════════════ Pasos */

.stepper{
  display:flex; gap:8px; padding:14px 22px;
  background:rgba(255,255,255,.75);
  border-bottom:1px solid var(--borde);
  overflow-x:auto;
}
.paso{
  flex:1 1 0; min-width:150px;
  display:flex; align-items:center; gap:11px;
  padding:10px 13px; border-radius:var(--radio);
  background:transparent; border:1px solid transparent;
  font-family:inherit; text-align:left; cursor:pointer;
  transition:var(--transicion);
}
.paso:hover{ background:var(--marca-tenue); }
.paso.is-active{ background:var(--marca-tenue); border-color:var(--marca-clara); box-shadow:0 4px 14px rgba(229,57,127,.13); }
.paso.is-hecho .paso__num{ background:var(--marca-clara); }
.paso__num{
  width:34px; height:34px; flex:none;
  display:grid; place-items:center; font-size:17px;
  border-radius:12px; background:var(--fondo-hundido);
}
.paso.is-active .paso__num{ background:#fff; }
.paso__txt b{ display:block; font-size:13px; }
.paso__txt small{ display:block; color:var(--tinta-tenue); font-size:11px; }

/* ═════════════════════════════════════════════════════════ Contenedor */

.contenedor{ max-width:1320px; margin:0 auto; padding:22px; }

.vista{ display:none; animation:aparecer .25s ease; }
.vista.is-active{ display:block; }
@keyframes aparecer{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }

.encabezado-vista{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:16px; flex-wrap:wrap; margin-bottom:18px;
}
.encabezado-vista__acciones{ display:flex; gap:8px; flex-wrap:wrap; }
.sub{ color:var(--tinta-suave); font-size:13px; max-width:70ch; margin-top:4px; }

.pie-vista{
  display:flex; justify-content:space-between; gap:12px;
  margin-top:20px; flex-wrap:wrap;
}
.pie-vista--centrado{ justify-content:center; }
.pie-vista > .btn:only-child{ margin-left:auto; }

/* ═══════════════════════════════════════════════════════════ Tarjetas */

.tarjeta{
  background:var(--papel);
  border:1px solid var(--borde);
  border-radius:var(--radio);
  padding:20px;
  margin-bottom:16px;
  box-shadow:var(--sombra);
}
.tarjeta__titulo{ margin-bottom:4px; }
.tarjeta__ayuda{ color:var(--tinta-tenue); font-size:12.5px; margin-bottom:14px; }
.tarjeta__cabecera{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:14px; flex-wrap:wrap; margin-bottom:14px;
}
.tarjeta__cabecera-acciones{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.tarjeta--ia{ border-color:var(--marca-clara); background:linear-gradient(180deg, var(--marca-tenue), var(--papel) 90px); }
.tarjeta--final{ border-color:var(--marca-clara); }

/* ══════════════════════════════════ Galería de plantillas (paso Inicio) */

.aviso-plantilla{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:13px 16px; margin-bottom:16px;
  border-radius:var(--radio);
  background:var(--acento-tenue); border:1px solid #DCD6FB;
  font-size:13px; color:#4B3FA8;
}
.aviso-plantilla b{ font-weight:700; }

.galeria{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:16px;
}
.plantilla-card{
  display:flex; flex-direction:column; gap:12px;
  padding:18px;
  border-radius:var(--radio);
  background:var(--papel); border:1px solid var(--borde);
  box-shadow:var(--sombra);
  transition:var(--transicion);
}
.plantilla-card:hover{ transform:translateY(-3px); border-color:var(--marca-clara); }
.plantilla-card.is-activa{
  border-color:var(--marca);
  box-shadow:0 0 0 3px var(--marca-tenue), var(--sombra);
}
.plantilla-card__cinta{
  display:inline-flex; align-items:center; gap:5px; align-self:flex-start;
  padding:3px 10px; border-radius:999px;
  background:var(--marca); color:#fff;
  font-size:10.5px; font-weight:700; letter-spacing:.03em;
}
.plantilla-card__logos{
  display:flex; align-items:center; gap:8px; height:46px;
  padding:6px 8px; border-radius:var(--radio-mini);
  background:var(--fondo-hundido);
}
.plantilla-card__logos img{ max-height:34px; max-width:31%; object-fit:contain; }
.plantilla-card__logos span{ font-size:11px; color:var(--tinta-tenue); }
.plantilla-card__nombre{ font-family:var(--fuente-titulo); font-size:16px; font-weight:600; }
.plantilla-card__meta{ color:var(--tinta-tenue); font-size:12px; display:flex; flex-direction:column; gap:2px; }
.plantilla-card__cuenta{
  display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
  padding:4px 10px; border-radius:999px;
  background:var(--marca-tenue); color:var(--marca-oscura);
  font-size:11.5px; font-weight:700;
}
.plantilla-card__acciones{ display:flex; gap:7px; flex-wrap:wrap; margin-top:auto; padding-top:4px; }

.plantilla-nueva{
  display:grid; place-content:center; gap:8px;
  min-height:210px; padding:18px; text-align:center;
  border-radius:var(--radio);
  border:2px dashed var(--borde-fuerte); background:rgba(255,255,255,.55);
  color:var(--tinta-suave); font-family:inherit; font-size:13.5px; font-weight:600;
  cursor:pointer; transition:var(--transicion);
}
.plantilla-nueva:hover{ border-color:var(--marca); color:var(--marca-oscura); background:var(--marca-tenue); }
.plantilla-nueva span{ font-size:34px; }

/* Panel de planeaciones de la plantilla abierta */
.planeaciones{ display:flex; flex-direction:column; gap:10px; }
.planeacion-item{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:14px;
  border:1px solid var(--borde); border-radius:var(--radio);
  background:var(--fondo); transition:var(--transicion);
}
.planeacion-item:hover{ border-color:var(--marca-clara); background:var(--papel); }
.planeacion-item__datos{ min-width:0; }
.planeacion-item__datos b{ display:block; font-size:14px; }
.planeacion-item__datos small{ display:block; color:var(--tinta-tenue); font-size:11.5px; }
.planeacion-item__acciones{ display:flex; gap:7px; flex:none; flex-wrap:wrap; }

/* ══════════════════════════════════════════════════════════ Formulario */

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
  gap:14px;
}
.campo{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.campo--ancho{ grid-column:1 / -1; }
.campo--mini{ font-size:12px; }
.campo--mini > span{ color:var(--tinta-suave); font-weight:600; font-size:11.5px; }

.campo > label,
.campo > label > span{ font-size:12.5px; font-weight:600; color:var(--tinta-suave); }
.pista{ color:var(--tinta-tenue); font-size:11.5px; font-weight:400; }

input[type=text], input[type=number], input[type=password], input[type=search],
select, textarea{
  font-family:inherit; font-size:13.5px; color:var(--tinta);
  padding:9px 11px;
  border:1px solid var(--borde); border-radius:var(--radio-mini);
  background:var(--papel);
  transition:var(--transicion);
  width:100%;
}
textarea{ resize:vertical; line-height:1.45; }
input:focus, select:focus, textarea:focus{
  outline:none; border-color:var(--marca-clara);
  box-shadow:0 0 0 3px var(--marca-tenue);
}
input[type=color]{
  padding:2px; height:34px; width:100%;
  border:1px solid var(--borde); border-radius:var(--radio-mini);
  background:var(--papel); cursor:pointer;
}
input[type=range]{ width:100%; accent-color:var(--marca); }

.check{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--tinta-suave); cursor:pointer; }
.check input{ width:16px; height:16px; accent-color:var(--marca); }

.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 11px; border-radius:999px;
  background:var(--fondo-hundido); color:var(--tinta-suave);
  font-size:12px; font-weight:600;
}
.chip--ok{ background:var(--exito-tenue); color:var(--exito); }
.chip--alerta{ background:var(--alerta-tenue); color:var(--alerta); }

/* ═══════════════════════════════════════════════ Logotipos de plantilla */

.logos-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
  gap:14px; margin-bottom:16px;
}
.logo-ranura{
  border:2px dashed var(--borde-fuerte); border-radius:var(--radio);
  padding:14px; text-align:center;
  background:var(--fondo); transition:var(--transicion);
}
.logo-ranura.is-lleno{ border-style:solid; border-color:var(--marca-clara); background:var(--papel); }
.logo-ranura__titulo{ font-size:12.5px; font-weight:700; color:var(--tinta-suave); margin-bottom:9px; }
.logo-ranura__marco{
  height:96px; display:grid; place-items:center;
  margin-bottom:10px; border-radius:var(--radio-mini);
  background:var(--fondo-hundido); overflow:hidden;
}
.logo-ranura__marco img{ max-width:100%; max-height:100%; object-fit:contain; }
.logo-ranura__vacio{ font-size:30px; opacity:.4; }
.logo-ranura__acciones{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
.logo-ranura input[type=file]{ display:none; }

/* ═════════════════════════════════════════════════ Ejes articuladores */

.ejes{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:8px; }
.eje{
  display:flex; align-items:center; gap:9px;
  padding:9px 12px; border-radius:var(--radio-mini);
  border:1px solid var(--borde); background:var(--papel);
  font-size:12.5px; cursor:pointer; transition:var(--transicion);
}
.eje:hover{ border-color:var(--marca-clara); }
.eje input{ width:15px; height:15px; accent-color:var(--marca); flex:none; }
.eje.is-marcado{ background:var(--marca-tenue); border-color:var(--marca-clara); font-weight:600; }

/* ══════════════════════════════════════════════════════════════ Firmas */

.firmas-lista{ display:flex; flex-direction:column; gap:12px; }
.firma{
  display:grid; grid-template-columns:auto 1fr 1fr 1fr auto;
  gap:10px; align-items:end;
  padding:13px; border-radius:var(--radio);
  background:var(--fondo); border:1px solid var(--borde);
}
.firma__orden{
  width:28px; height:28px; display:grid; place-items:center;
  border-radius:10px; background:var(--marca-tenue);
  font-size:12px; font-weight:700; color:var(--marca-oscura);
}
@media (max-width:900px){
  .firma{ grid-template-columns:auto 1fr auto; }
  .firma .campo{ grid-column:2 / 3; }
}

/* ══════════════════════════════════════════════════════════════ Fases */

.fases-lista{ display:flex; flex-direction:column; gap:14px; }
.fase{
  border:1px solid var(--borde); border-radius:var(--radio);
  background:var(--fondo); overflow:hidden;
}
.fase__cabecera{
  display:flex; align-items:center; gap:10px;
  padding:11px 14px; background:var(--marca-tenue);
  border-bottom:1px solid var(--borde);
  flex-wrap:wrap;
}
.fase__num{
  width:30px; height:30px; flex:none; display:grid; place-items:center;
  border-radius:10px; background:var(--papel);
  font-weight:700; font-size:13px; color:var(--marca-oscura);
}
.fase__titulo{ font-weight:700; font-size:13.5px; flex:1; min-width:120px; }
.fase__acciones{ display:flex; gap:6px; }
.fase__cuerpo{ padding:14px; display:grid; gap:12px; grid-template-columns:1fr 1fr; }
.fase__cuerpo .campo--ancho{ grid-column:1 / -1; }
@media (max-width:820px){ .fase__cuerpo{ grid-template-columns:1fr; } }

/* ═══════════════════════════════════════════════════ Interruptor de IA */

.interruptor{ display:flex; align-items:center; gap:14px; cursor:pointer; }
.interruptor input{ position:absolute; opacity:0; pointer-events:none; }
.interruptor__pista{
  width:52px; height:29px; flex:none;
  border-radius:999px; background:var(--borde-fuerte);
  position:relative; transition:var(--transicion);
}
.interruptor__bolita{
  position:absolute; top:3px; left:3px;
  width:23px; height:23px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(96,36,66,.28);
  transition:var(--transicion);
}
.interruptor input:checked + .interruptor__pista{ background:var(--marca); }
.interruptor input:checked + .interruptor__pista .interruptor__bolita{ transform:translateX(23px); }
.interruptor input:focus-visible + .interruptor__pista{ box-shadow:0 0 0 3px var(--marca-tenue); }
.interruptor__texto b{ display:block; font-size:14px; }
.interruptor__texto small{ display:block; color:var(--tinta-tenue); font-size:12px; }

.ia-panel{ margin-top:16px; padding-top:16px; border-top:1px dashed var(--borde); }
.ia-panel__acciones{
  display:flex; align-items:center; justify-content:flex-end;
  gap:12px; margin-top:14px; flex-wrap:wrap;
}

/* ══════════════════════════════════════════════════ Editor y lienzo */

.editor{
  display:grid; grid-template-columns:270px 1fr;
  gap:16px; align-items:start;
}
@media (max-width:1050px){ .editor{ grid-template-columns:1fr; } }

.panel{
  background:var(--papel); border:1px solid var(--borde);
  border-radius:var(--radio); padding:16px;
  box-shadow:var(--sombra);
  position:sticky; top:82px;
  max-height:calc(100vh - 110px); overflow:auto;
}
.panel__titulo{ font-size:14px; margin-bottom:3px; }
.panel__ayuda{ color:var(--tinta-tenue); font-size:11.5px; margin-bottom:11px; }
.panel__cuerpo{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }

.bloques{ list-style:none; margin:0 0 18px; padding:0; display:flex; flex-direction:column; gap:6px; }
.bloque-item{
  display:flex; align-items:center; gap:8px;
