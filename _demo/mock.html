<script>
/* Simulador de google.script.run para probar la interfaz fuera de Apps Script.
   No se sube a Apps Script: solo lo usa _demo/preview.html. */
(function () {
'use strict';

const ok  = data => ({ ok: true, data: data });
const dormir = ms => new Promise(r => setTimeout(r, ms));
const idCorto = () => Math.random().toString(36).slice(2, 10);

let planeaciones = [];   // cada una lleva su carpetaId
let plantillas = [];

const CATALOGOS = {
  ejes: ['Inclusión', 'Interculturalidad crítica', 'Igualdad de género', 'Pensamiento crítico',
         'Vida saludable', 'Artes y experiencias estéticas',
         'Apropiación de las culturas a través de la lectura y escritura'],
  campos: ['Saberes y pensamiento científico', 'Lenguajes', 'Ética, Naturaleza y Sociedades',
           'De lo humano y lo comunitario'],
  fasesSugeridas: [
    { fase: 'Fase 1. Introducción al tema y a la forma de trabajo.', construir: 'Selección / identificación / negociación del tema' },
    { fase: 'Fase 2. Exploración y construcción del conocimiento.', construir: 'Diseño de la investigación · Desarrollo y exploración' },
    { fase: 'Fase 3. Representación y experimentación.', construir: 'Representación' },
    { fase: 'Fase 4. Demostración de lo aprendido.', construir: 'Actividades' },
    { fase: 'Fase 5. Metacognición.', construir: 'Metacognición' },
    { fase: 'Fase 6. Difusión y cierre.', construir: 'Difusión de resultados' },
    { fase: 'Fase 7. Seguimiento.', construir: 'Seguimiento y mejora' }
  ],
  firmasPorDefecto: [
    { rol: 'ELABORÓ DOCENTE EN FORMACIÓN',
      detalle: 'LIC. EN ENSEÑANZA Y APRENDIZAJE DE LA QUÍMICA EN EDUCACIÓN SECUNDARIA',
      nombre: 'C. GUADALUPE LUGO TINOCO' },
    { rol: 'REVISÓ', detalle: 'COORDINADORA DEL CURSO ESTRATEGIAS DE TRABAJO DOCENTE Y SABERES PEDAGÓGICOS', nombre: '' },
    { rol: 'REVISÓ', detalle: 'TITULAR DE LA DISCIPLINA', nombre: '' }
  ],
  cicloSugerido: '2026-2027'
};

let config = {
  proveedor: 'gemini', modelo: 'gemini-2.0-flash',
  tieneApiKey: true, apiKeyMascara: 'demo••••••••1234',
  usuario: 'demo@escuela.mx', version: '2.0.0 (demo)'
};

function ahora() { return new Date().toLocaleString('es-MX'); }

function proyectoFalso(datos, contenido, opciones) {
  const numFases = Math.min(Math.max(Number(opciones && opciones.numFases) || 5, 1), 10);
  const porFase = Number(opciones && opciones.actividadesPorFase) || 5;
  const tema = (contenido.temas || contenido.contenido || 'el tema').split('\n')[0];

  const fases = [];
  for (let i = 0; i < numFases; i++) {
    const sug = CATALOGOS.fasesSugeridas[i] || { fase: 'Fase ' + (i + 1) + '.', construir: 'Actividades' };
    const actividades = [];
    for (let a = 0; a < porFase; a++) {
      actividades.push('Actividad ' + (a + 1) + ' de la fase ' + (i + 1) +
        ': los estudiantes trabajan sobre ' + tema.toLowerCase() + ' con apoyo del docente.');
    }
    fases.push({
      numero: i + 1, fase: sug.fase, construir: sug.construir,
      actividades: actividades,
      recursos: ['Pizarrón', 'Plumones', 'Libro de texto', 'Cuaderno del alumno'],
      sesiones: 0
    });
  }

  const total = Number(datos.sesiones) || 0;
  if (total) {
    const base = Math.floor(total / fases.length);
    const resto = total - base * fases.length;
    fases.forEach((f, i) => { f.sesiones = base + (i < resto ? 1 : 0); });
  } else {
    fases.forEach(f => { f.sesiones = 3; });
  }

  return {
    proyecto: {
      nombre: 'Proyecto demo sobre ' + tema,
      problematica: 'Los estudiantes no reconocen la utilidad de ' + tema.toLowerCase() + ' en su vida diaria.',
      proposito: 'Aplicar los conocimientos de ' + tema.toLowerCase() +
                 ' para resolver una necesidad concreta de la comunidad escolar.',
      productoFinal: 'Prototipo elaborado por los equipos y expuesto ante el grupo.'
    },
    fases: fases,
    generadoEn: 'demo'
  };
}

function guardarPlantillaMock(p) {
  p.id = p.id || idCorto();
  p.archivoId = p.archivoId || 'pl' + idCorto();
  p.carpetaId = p.carpetaId || 'car' + p.id;
  p.actualizado = ahora();
  plantillas = plantillas.filter(x => x.archivoId !== p.archivoId).concat([p]);
  return { archivoId: p.archivoId, nombre: p.nombre, id: p.id, carpetaId: p.carpetaId };
}

const API = {
  obtenerCatalogos: () => CATALOGOS,
  obtenerConfiguracion: () => config,
  guardarConfiguracion: cfg => {
    config = Object.assign({}, config, cfg, { tieneApiKey: cfg.apiKey !== 'BORRAR' });
    return config;
  },
  probarConexionIA: () => ok({ respuesta: 'CONEXION_OK (demo)' }),

  obtenerCarpetaDrive: () => ok({ id: 'demo', nombre: 'Planeaciones Secundaria', url: 'https://drive.google.com' }),

  obtenerPlantillaActiva: () => ok(plantillas.length ? plantillas[plantillas.length - 1] : null),
  guardarPlantilla: p => ok(guardarPlantillaMock(p)),
  listarPlantillas: () => ok(plantillas.map(p => ({
    archivoId: p.archivoId, id: p.id, nombre: p.nombre, procedencia: p.procedencia,
    cct: p.cct, cicloEscolar: p.cicloEscolar, tituloPlan: p.tituloPlan,
    firmas: (p.firmas || []).length,
    logos: (p.imagenes || []).filter(i => i && i.driveId).length,
    carpetaId: p.carpetaId,
    planeaciones: planeaciones.filter(e => e.carpetaId === p.carpetaId).length,
    actualizado: p.actualizado, activa: false
  }))),
  cargarPlantilla: id => ok(plantillas.find(p => p.archivoId === id) || null),
  eliminarPlantilla: id => {
    const p = plantillas.find(x => x.archivoId === id);
    const n = p ? planeaciones.filter(e => e.carpetaId === p.carpetaId).length : 0;
    if (p) planeaciones = planeaciones.filter(e => e.carpetaId !== p.carpetaId);
    plantillas = plantillas.filter(x => x.archivoId !== id);
    return ok({ eliminado: true, planeaciones: n });
  },
  duplicarPlantilla: (id, nombreNuevo) => {
    const original = plantillas.find(p => p.archivoId === id);
    if (!original) return { ok: false, error: 'No encontré la plantilla.' };
    const copia = JSON.parse(JSON.stringify(original));
    copia.id = null; copia.archivoId = null; copia.carpetaId = null;
    copia.nombre = (nombreNuevo || (original.nombre + ' (copia)'));
    guardarPlantillaMock(copia);
    return ok(copia);
  },

  subirImagen: (ranura, nombre) => ok({ ranura: ranura, driveId: 'img-' + ranura + '-' + idCorto(), nombre: nombre, tipo: 'image/png' }),
  eliminarImagen: () => ok({ eliminado: true }),

  guardarPlaneacion: estado => {
    estado.id = estado.id || 'p' + idCorto();
    estado.archivoId = estado.archivoId || 'ar' + idCorto();
    estado.carpetaId = (estado.plantilla && estado.plantilla.carpetaId) || '';
    estado.actualizado = ahora();
    planeaciones = planeaciones.filter(p => p.archivoId !== estado.archivoId).concat([estado]);
    return ok({ archivoId: estado.archivoId, nombre: 'demo.json', url: '#', carpetaId: estado.carpetaId });
  },
  listarPlaneaciones: carpetaId => ok(planeaciones
    .filter(e => (carpetaId ? e.carpetaId === carpetaId : !e.carpetaId))
    .map(e => ({
      archivoId: e.archivoId, nombre: 'demo.json', actualizado: e.actualizado,
      escuela: (e.datos || {}).escuela, gradoGrupo: (e.datos || {}).gradoGrupo,
      disciplina: (e.datos || {}).disciplina, periodo: (e.datos || {}).periodo,
      proyecto: (e.proyecto || {}).nombre,
      fases: (e.fases || []).length, docId: e.docId || ''
    }))),
  cargarPlaneacion: id => ok(planeaciones.find(p => p.archivoId === id) || null),
  eliminarPlaneacion: id => { planeaciones = planeaciones.filter(p => p.archivoId !== id); return ok({ eliminado: true }); },
  duplicarPlaneacion: id => {
    const original = planeaciones.find(p => p.archivoId === id);
    const copia = JSON.parse(JSON.stringify(original));
    copia.archivoId = 'ar' + idCorto();
    copia.proyecto = copia.proyecto || {};
    copia.proyecto.nombre = (copia.proyecto.nombre || 'Planeación') + ' (copia)';
    copia.actualizado = ahora();
    planeaciones.push(copia);
    return ok(copia);
  },

  generarProyecto: (datos, contenido, opciones) => ok(proyectoFalso(datos, contenido, opciones)),
  regenerarFase: (datos, contenido, proyecto, fases, indice) => {
    const f = JSON.parse(JSON.stringify(fases[indice]));
    f.actividades = f.actividades.map((a, i) => 'Idea nueva ' + (i + 1) + ' para la fase ' + (indice + 1) + '.');
    return ok(f);
  },
  balancearSesiones: (fases, total) => {
    const copia = JSON.parse(JSON.stringify(fases || []));
    const base = Math.floor((total || 0) / (copia.length || 1));
    const resto = (total || 0) - base * copia.length;
    copia.forEach((f, i) => { f.sesiones = base + (i < resto ? 1 : 0); });
    const asignadas = copia.reduce((s, f) => s + f.sesiones, 0);
    return ok({ fases: copia, resumen: { asignadas: asignadas, disponibles: total,
      diferencia: 0, cuadra: true, minutosPorSesion: 50,
      minutosTotales: asignadas * 50, tiempoLegible: Math.round(asignadas * 50 / 60) + ' h' } });
  },

  generarDocumento: payload => ok({
    docId: 'doc-demo', url: 'https://docs.google.com', nombre: payload.titulo,
    celdasFusionadas: 0, avisoFusion: 'Modo demo: no se escribió ningún documento real.'
  }),
  descargarDocumento: () => ({ ok: false, error: 'En modo demo no hay archivo que descargar.' }),
  exportarPDF: () => ok({ url: 'https://drive.google.com', nombre: 'demo.pdf' })
};

const run = {
  _exito: null, _falla: null,
  withSuccessHandler(fn) { const c = Object.create(run); c._exito = fn; c._falla = this._falla; return c; },
  withFailureHandler(fn) { const c = Object.create(run); c._falla = fn; c._exito = this._exito; return c; }
};

Object.keys(API).forEach(nombre => {
  run[nombre] = function () {
    const args = Array.prototype.slice.call(arguments);
    const exito = this._exito, falla = this._falla;
    dormir(280).then(() => {
      try { if (exito) exito(API[nombre].apply(null, args)); }
      catch (err) { if (falla) falla(err); }
    });
  };
});

window.google = { script: { run: run, host: { close() {} } } };
console.info('Modo demo activo: el backend está simulado.');
})();
</script>
